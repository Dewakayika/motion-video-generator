<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Genuine Solutions · 30s bumper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{
  --chrome-bg:#E9EEF5; --chrome-fg:#09295C; --chrome-muted:#5B6B86; --chrome-panel:#FFFFFF; --chrome-line:#D5DDE8;
  --bg:#040A16; --green:#41FF95; --navy:#09295C; --txt:#F2F6FB; --mut:#8EA0BD;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --chrome-bg:#040C1C; --chrome-fg:#E6FFF1; --chrome-muted:#8EA0BD; --chrome-panel:#0A1730; --chrome-line:#1B2C4A; }
}
:root[data-theme="dark"]{ --chrome-bg:#040C1C; --chrome-fg:#E6FFF1; --chrome-muted:#8EA0BD; --chrome-panel:#0A1730; --chrome-line:#1B2C4A; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--chrome-bg);color:var(--chrome-fg);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#viewport{position:relative;width:min(calc(100vw - 32px),calc((100vh - 130px) * 16 / 9));aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--bg);box-shadow:0 20px 60px rgba(4,12,28,.35)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--txt)}

/* controls */
#controls{width:min(calc(100vw - 32px),calc((100vh - 130px) * 16 / 9));display:flex;align-items:center;gap:14px;background:var(--chrome-panel);border:1px solid var(--chrome-line);border-radius:12px;padding:10px 14px}
#controls button{font:inherit;font-size:14px;font-weight:600;color:var(--chrome-fg);background:transparent;border:1px solid var(--chrome-line);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
#controls button:focus-visible,#scrub:focus-visible{outline:2px solid #41FF95;outline-offset:2px}
#controls button[aria-pressed="true"]{background:#41FF95;color:#061A3A;border-color:#41FF95}
#time{font-variant-numeric:tabular-nums;font-size:14px;color:var(--chrome-muted);min-width:92px}
#track{position:relative;flex:1;display:flex;align-items:center}
#scrub{width:100%;accent-color:#41FF95;margin:0}
#marks{position:absolute;left:0;right:0;top:-9px;height:6px;pointer-events:none}
#marks i{position:absolute;top:0;width:2px;height:6px;background:var(--chrome-muted);opacity:.6;border-radius:1px}
#sceneName{font-size:13px;color:var(--chrome-muted);min-width:150px;text-align:right}
@media (max-width:700px){#sceneName{display:none}}

/* background: one dark field, one glow at a time */
.bg{position:absolute;inset:0}
#bgBase{background:radial-gradient(70% 60% at 50% 42%,#0A1A33 0%,#040A16 72%)}
#halo{position:absolute;left:-420px;top:-560px;width:1500px;height:1200px;border-radius:50%;background:radial-gradient(closest-side,rgba(65,255,149,.20),rgba(65,255,149,0));opacity:0;visibility:hidden}
#arc{position:absolute;left:50%;top:1180px;width:2600px;height:1500px;margin-left:-1300px;border-radius:50%;border-top:3px solid rgba(65,255,149,.85);box-shadow:0 -40px 160px rgba(65,255,149,.32),inset 0 60px 170px rgba(65,255,149,.16);opacity:0;visibility:hidden}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 100% at 50% 50%,transparent 58%,rgba(0,0,0,.55))}

.scene{position:absolute;inset:0;opacity:0;visibility:hidden}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.t{margin:0;text-align:center;font-size:64px;font-weight:500;letter-spacing:-.025em;line-height:1.15;color:var(--txt)}
.t em,.lt em{font-style:normal;color:var(--green)}
.w{display:inline-block;opacity:0;will-change:transform}
.star svg{display:block;width:100%;height:100%}
.spk{position:absolute;width:22px;height:22px;color:#fff;opacity:0;visibility:hidden}
.spk svg{display:block;width:100%;height:100%}

/* glass surface */
.glass{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 40px 100px rgba(0,0,0,.45);backdrop-filter:blur(20px)}

/* logo (recreated; swap with official SVG in production) */
.logo{display:inline-flex;flex-direction:column;align-items:flex-end;color:#fff;line-height:1}
.logo .lw{font-size:128px;font-weight:600;letter-spacing:-.03em;position:relative}
.logo .lg{color:#41FF95;position:relative}
.logo .li{position:relative}
.logo .li .star{position:absolute;width:.2em;height:.2em;left:-.01em;top:-.12em;color:#41FF95}
.logo .ls{font-size:42px;font-weight:500;letter-spacing:.04em;margin-top:6px}
.tag{margin-top:44px;font-size:24px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);opacity:0}

/* scene 3: rotating service */
.slot{display:grid;margin-top:44px;padding:30px 64px;border-radius:999px;border-color:rgba(65,255,149,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 70px rgba(65,255,149,.16);opacity:0}
.slot span{grid-area:1/1;text-align:center;font-size:58px;font-weight:600;letter-spacing:-.02em;color:var(--green);white-space:nowrap;opacity:0}
.badges{display:flex;gap:44px;margin-top:56px}
.badge{display:inline-flex;align-items:center;gap:12px;font-size:24px;font-weight:500;color:var(--mut);opacity:0}
.badge .star{width:18px;height:18px;color:#41FF95}

/* scene 4: product walkthrough (Figma: Genuine Solution app, 1440×1024 frames) */
.hlw{position:absolute;left:0;right:0;top:56px;display:grid;justify-items:center;z-index:6;pointer-events:none}
.pill{grid-area:1/1;margin:0;padding:14px 32px;border-radius:999px;font-size:38px;font-weight:500;letter-spacing:-.02em;line-height:1.2;white-space:nowrap;color:var(--txt);background:rgba(4,10,22,.72);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(16px);box-shadow:0 20px 50px rgba(0,0,0,.35);opacity:0;visibility:hidden}
.pill em{font-style:normal;color:var(--green)}
#cam{position:absolute;left:0;top:0;width:1440px;height:1024px;transform-origin:0 0;opacity:0;visibility:hidden}
#app{position:absolute;inset:0;border-radius:18px;overflow:hidden;background:#fff;font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:20px;color:#0a0a0a;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 60px 140px rgba(0,0,0,.6),0 0 120px rgba(65,255,149,.08)}
#app img{display:block;flex:none}
#acur{position:absolute;left:0;top:0;width:36px;height:36px;z-index:21;opacity:0;visibility:hidden;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
#aring{position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid #6363ae;z-index:20;opacity:0;visibility:hidden}
.ga-side{position:absolute;left:0;top:0;bottom:0;width:240px;padding:16px;border-right:1px solid #e5e5e5;background:#fff}
.ga-logo{padding:0 12px 24px;font-size:16px;line-height:24px;font-weight:500;color:#171717}
.ga-logo b{font-weight:500;color:#6363ae}
.ga-menu{display:flex;flex-direction:column;gap:8px}
.ga-mi{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid transparent;border-radius:8px;color:#525252}
.ga-mi .ga-chev{margin-left:auto}
.ga-mi.act{border-color:#cccce9;color:#6363ae}
.ga-sub{padding-left:20px}
.ga-sub div{height:32px;display:flex;align-items:center;padding-left:16px;border-left:1px solid #e5e5e5;color:#525252}
.ga-sub .act{color:#6363ae}
.ga-top{position:absolute;left:240px;right:0;top:0;height:64px;display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:0 24px;border-bottom:1px solid #e5e5e5;background:#fff}
.ga-bell{position:relative;padding:8px;border:1px solid #e5e5e5;border-radius:8px}
.ga-bell i{position:absolute;right:9px;top:7px;width:6px;height:6px;border-radius:50%;background:#ef4444}
.ga-user{display:flex;align-items:center;gap:4px}
.ga-av{border-radius:50%;overflow:hidden;flex:none}
.ga-av img{width:100%;height:100%;object-fit:cover}
.ga-main{position:absolute;left:240px;right:0;top:64px;bottom:0;background:#fafafa;overflow:hidden}
.ga-view{position:absolute;inset:0;padding:24px}
#vKan{opacity:0;visibility:hidden}
.ga-crumb{display:flex;align-items:center;gap:4px;color:#737373}
.ga-crumb b{font-weight:400;color:#0a0a0a}
.ga-head{display:flex;align-items:center;justify-content:space-between;height:80px;margin-top:24px}
.ga-job{display:flex;align-items:center;gap:12px}

.ga-jt{display:flex;align-items:center;gap:8px}

.ga-active{display:inline-block;padding:2px 8px;border-radius:999px;background:#15803d;color:#fafafa;font-size:12px;line-height:16px;font-weight:500}

.ga-acts{display:flex;gap:10px}

.ga-ib{padding:9px;border:1px solid #e5e5e5;border-radius:8px;background:#fff}

.ga-tab.act::after,.ga-stab.act::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px 2px 0 0;background:#6363ae}
.ga-fc{display:grid;grid-template-columns:415px 720px;gap:24px;margin-top:24px;align-items:start}
.ga-box{background:#fff;border:1px solid #e5e5e5;border-radius:16px}
.ga-crit{padding:20px}
.ga-crit h4{margin:0;font-size:14px;font-weight:500}
.ga-cl{display:flex;flex-direction:column;gap:24px;margin-top:24px}
.ga-cl b{display:block;font-weight:500}
.ga-cl p{margin:12px 0 0;color:#737373}
.ga-cl .ga-active,.ga-cl .ga-tags{margin-top:12px}
.ga-tags{display:flex;gap:8px}
.ga-tag{min-width:48px;padding:3px 8px;border-radius:999px;border:1px solid #cccce9;background:#eeeef8;color:#6363ae;font-size:12px;line-height:16px;font-weight:500;text-align:center}
.ga-tag.g{border-color:rgba(21,128,61,.15);background:rgba(21,128,61,.05);color:#15803d}
.ga-fil{display:flex;gap:16px}
.ga-in{display:flex;align-items:center;gap:8px;height:36px;white-space:nowrap;padding:0 12px;border:1px solid #e5e5e5;border-radius:8px;background:#fff;color:#737373}
.ga-in .ic{width:20px;display:flex;justify-content:center}

.ga-showing{margin:24px 0 16px;color:#737373}
.ga-list{display:flex;flex-direction:column;gap:24px}
.ga-fcard{height:160px;display:flex;justify-content:space-between;padding:16px;background:#fff;border:1px solid #e5e5e5;border-radius:16px}

.ga-fl{display:flex;gap:16px}

.ga-chk i{position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:4px;border:1px solid #d4d4d4;background:#fff;display:flex;align-items:center;justify-content:center}
.ga-chk img{opacity:0}
.sel .ga-chk i{background:#6363ae;border-color:#6363ae}
.sel .ga-chk img{opacity:1}
.ga-fcol{display:flex;flex-direction:column;gap:20px}
.ga-who{display:flex;align-items:center;gap:16px}
.ga-who b{display:block;font-size:16px;line-height:24px;font-weight:500}
.ga-who span{display:block;margin-top:2px;color:#737373}
.ga-mc{display:flex;flex-direction:column;gap:16px}
.ga-mt{display:flex;gap:16px;color:#737373}
.ga-mt span:first-child{color:#404040}
.ga-fr{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between}
.ga-upd{color:#737373}
.ga-addw{display:grid;justify-items:end}
.ga-addw>span{grid-area:1/1}
.ga-btno,.ga-btnadd{display:flex;align-items:center;gap:8px;min-height:36px;padding:7px 15px;border-radius:8px;background:#fff}
.ga-btno{border:1px solid #6363ae;color:#6363ae;font-weight:500}
.ga-btnadd{border:1px solid #d4d4d4;opacity:0}
.sel .ga-btno{opacity:.75}
.added .ga-btno{opacity:0}

.ga-fab{position:absolute;left:400px;bottom:24px;display:flex;align-items:center;gap:24px;padding:16px 24px;background:#fff;border:1px solid #e5e5e5;border-radius:12px;box-shadow:0 10px 7.5px rgba(0,0,0,.1),0 4px 3px rgba(0,0,0,.1);color:#404040;opacity:0;visibility:hidden}
.ga-fab .itm{display:flex;align-items:center;gap:8px}
.ga-fab .sep{width:1px;height:24px;border-radius:100px;background:#e5e5e5}
.ga-btnps{display:flex;align-items:center;gap:6px;min-height:32px;padding:6px 12px;border-radius:8px;background:#6363ae;color:#fafafa;font-weight:500}
.ga-bar{display:flex;align-items:center;justify-content:space-between;height:36px;margin-top:24px}
.ga-tot{display:flex;align-items:center;gap:10px;color:#737373}
.ga-tot b{padding:2px 12px;border-radius:6px;background:#6363ae;color:#fafafa;font-size:12px;line-height:16px;font-weight:500}
.ga-bar .r{display:flex;gap:16px}

.ga-filter{display:flex;align-items:center;gap:8px;min-height:36px;padding:7px 15px;border:1px solid #6363ae;border-radius:8px;background:#fff;color:#6363ae;font-weight:500}
.ga-clear{display:flex;align-items:center;padding:8px 16px;color:#404040;font-weight:500}
.ga-board{position:absolute;left:24px;top:296px;width:1400px;height:640px}
.ga-col{position:absolute;top:0;width:312px;height:640px;background:#f5f5f5;border:1px solid #e5e5e5;border-radius:16px;box-shadow:24px 24px 80px rgba(0,0,0,.01)}
.ga-ch{display:flex;align-items:center;justify-content:space-between;padding:15px}
.ga-ch .l{display:flex;align-items:center;gap:4px}
.ga-ct{padding:4px 12px;border-radius:6px;color:#fff;font-weight:500}
.ga-cnt{display:grid;min-width:32px;padding:3px 8px;border:1px solid #e5e5e5;border-radius:6px;background:#fff;text-align:center}
.ga-cnt b{grid-area:1/1;font-weight:500}
.ga-cnt b+b{opacity:0}
.ga-kc{position:absolute;width:280px;padding:15px;display:flex;flex-direction:column;gap:16px;background:#fff;border:1px solid #e5e5e5;border-radius:16px}

.ga-dd{position:absolute;width:200px;padding:2px;background:#fff;border:1px solid #e5e5e5;border-radius:12px;box-shadow:0 4px 3px rgba(0,0,0,.1),0 2px 2px rgba(0,0,0,.1);z-index:5;opacity:0;visibility:hidden}

.ga-bd{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:8;opacity:0;visibility:hidden}
.ga-sheet{position:absolute;right:0;top:0;bottom:0;width:640px;display:flex;flex-direction:column;background:#fff;z-index:9}

/* scene 6: phone */
.lt{position:absolute;left:200px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:10px}
.lt h2{margin:0;font-size:64px;font-weight:500;letter-spacing:-.025em;line-height:1.15}

// split words
function split(el){
  const walk=n=>{[...n.childNodes].forEach(c=>{
    if(c.nodeType===3){const f=document.createDocumentFragment();c.textContent.split(/(\s+)/).forEach(t=>{if(!t)return;if(/^\s+$/.test(t)){f.appendChild(document.createTextNode(t))}else{const s=document.createElement('span');s.className='w';s.textContent=t;f.appendChild(s)}});c.replaceWith(f)}
    else if(c.nodeType===1&&!c.classList.contains('w'))walk(c)})};
  walk(el);return el.querySelectorAll('.w');
}

  tl.fromTo('#halo',{autoAlpha:0,x:0},{autoAlpha:1,x:700,duration:15,ease:'none'},7.2);
  words($('#h3'),7.35,.07);
  tl.fromTo('#slot',{autoAlpha:0,y:30,scale:.95},{autoAlpha:1,y:0,scale:1,duration:.6},7.8);
  const items=$$('#slot span');
  tl.fromTo(items[0],{autoAlpha:0,y:40},{autoAlpha:1,y:0,duration:.45},7.9);
  items.slice(1).forEach((it,k)=>{const t=8.65+k*.75;
    tl.to(items[k],{autoAlpha:0,y:-40,duration:.35,ease:'power2.in'},t);
    tl.fromTo(it,{autoAlpha:0,y:40},{autoAlpha:1,y:0,duration:.45},t+.15)});
  tl.fromTo('#s3 .badge',{autoAlpha:0,y:16},{autoAlpha:1,y:0,duration:.5,stagger:.12},10.3);
  out('#c3',11.15);
  hide('#s3',11.65,.1);

  /* 4–5 Product walkthrough 11.6–22.6 (app UI from Figma) */
  const AC=$('#acur'),AR=$('#aring');
  const amove=(p,t,d=.6)=>tl.to(AC,{x:p.x-6,y:p.y-3,duration:d,ease:'power2.inOut'},t);
  const aclick=(p,t)=>{tl.to(AC,{scale:.85,duration:.09,transformOrigin:'15% 10%'},t).to(AC,{scale:1,duration:.16},t+.09);tl.set(AR,{x:p.x,y:p.y,scale:.2,autoAlpha:1},t).to(AR,{scale:1.3,autoAlpha:0,duration:.5,ease:'power2.out'},t)};
  // camera: put app point (cx,cy) at stage (960,560) with scale s
  const camTo=(t,s,cx,cy,d=1)=>tl.to('#cam',{scale:s,x:960-cx*s,y:560-cy*s,duration:d,ease:'power3.inOut'},t);
  const pill=(id,t,tOut)=>{tl.fromTo(id,{autoAlpha:0,y:-12},{autoAlpha:1,y:0,duration:.45},t);words($(id),t+.1,.06);
    tl.to(id,{autoAlpha:0,y:-12,filter:'blur(6px)',duration:.35,ease:'power2.in'},tOut)};
  const setCls=(el,cls,t)=>tl.set(el,{attr:{class:cls}},t);
  gsap.set(AC,{x:1180,y:900});

  show('#s4',11.55,.1);
  tl.fromTo('#cam',{autoAlpha:0,scale:.8,x:384,y:360},{autoAlpha:1,y:200,duration:1.0},11.7);
  pill('#p4a',11.75,13.75);
  // Find Candidates: criteria, then the ranked list
  camTo(12.7,1.3,471,455,1.0);
  tl.to('#fCrit',{boxShadow:'0 0 0 2px #6363ae,0 16px 40px rgba(99,99,174,.18)',duration:.4},13.0);
  tl.to('#fCrit',{boxShadow:'0 0 0 0 rgba(99,99,174,0),0 0 0 rgba(0,0,0,0)',duration:.4},13.9);
  pill('#p4b',13.95,16.3);
  camTo(13.9,1.18,1063,700,1.0);
  tl.to('#fScroll',{y:SCROLL,duration:1.0,ease:'power3.inOut'},13.9);
  tl.set(AC,{x:M.chk1.x+160,y:M.chk1.y+140},14.4);show(AC,14.45,.2);
  amove(M.chk1,14.5,.45);aclick(M.chk1,14.95);setCls(fJohn,'ga-fcard sel',15.0);
  amove(M.chk2,15.1,.35);aclick(M.chk2,15.45);setCls(fAli,'ga-fcard sel',15.5);
  tl.fromTo('#fab',{autoAlpha:0,y:20},{autoAlpha:1,y:0,duration:.35},15.5);
  amove(M.add2,15.6,.45);aclick(M.add2,16.05);
  tl.to('#fab .ga-btnps',{scale:.95,duration:.08},16.05).to('#fab .ga-btnps',{scale:1,duration:.15},16.13);
  setCls(fJohn,'ga-fcard added',16.2);setCls(fAli,'ga-fcard added',16.2);
  hide('#fab',16.25,.25);hide(AC,16.35,.2);
  // Kanban: move a candidate to Screening
  camTo(16.4,.8,720,450,.9);
  hide('#vFind',16.45,.35);show('#vKan',16.55,.4);
  pill('#p5a',16.6,19.9);
  camTo(17.0,1.25,590,560,1.0);
  tl.set(AC,{x:M.kell.x+200,y:M.kell.y+160},17.3);show(AC,17.35,.2);
  amove(M.kell,17.4,.45);aclick(M.kell,17.85);
  tl.fromTo('#m1',{autoAlpha:0,scale:.96,transformOrigin:'90% 0'},{autoAlpha:1,scale:1,duration:.2},17.9);
  amove(M.move,18.05,.35);setCls($('#m1 .mv'),'ga-mit mv hov',18.35);
  tl.fromTo('#m2',{autoAlpha:0,scale:.96,transformOrigin:'0 0'},{autoAlpha:1,scale:1,duration:.2},18.4);
  amove(M.scr,18.45,.35);setCls($('#m2 [data-st="Matched"]'),'ga-mit',18.7);setCls($('#m2 [data-st="Screening"]'),'ga-mit hov',18.7);
  aclick(M.scr,18.85);hide('#m1,#m2',18.9,.15);hide(AC,19.0,.2);
  tl.to(kJohn,{x:COL_X,y:CARD_Y,boxShadow:'0 24px 48px rgba(0,0,0,.14)',rotation:2,duration:.7,ease:'power3.inOut'},19.0);
  tl.to(kJohn,{rotation:0,boxShadow:'0 0 0 rgba(0,0,0,0)',duration:.25},19.7);
  tl.to(kAli,{y:-CARD_Y,duration:.5,ease:'power3.inOut'},19.2);
  [0,1].forEach(k=>{const b=$$(`[data-cnt="${k}"] b`);tl.set(b[0],{autoAlpha:0},19.5);tl.set(b[1],{autoAlpha:1},19.5)});
  // Resume sheet for a recommended candidate
  camTo(19.75,.8,720,450,.8);
  pill('#p5b',20.1,22.15);
  tl.set(AC,{x:M.udin.x-180,y:M.udin.y+160},19.95);show(AC,20.0,.2);
  amove(M.udin,20.05,.45);aclick(M.udin,20.5);hide(AC,20.6,.2);
  tl.fromTo('#gaBd',{autoAlpha:0},{autoAlpha:.8,duration:.4},20.55);
  tl.fromTo('#gaSheet',{x:680},{x:0,duration:.6,ease:'power3.out'},20.55);
  camTo(21.1,1.02,1120,520,1.1);
  tl.to('#gaRec',{scale:1.08,duration:.25,yoyo:true,repeat:1,ease:'power2.inOut'},21.4);
  tl.to('#cam',{autoAlpha:0,y:'+=60',duration:.45,ease:'power2.in'},22.15);
  hide('#s4',22.7,.1);

  /* 6 Job seeker 22.6–26.2 */
  show('#s6',22.6,.1);
  tl.fromTo('#phone',{autoAlpha:0,y:160,rotationY:-14,transformPerspective:2200},{autoAlpha:1,y:0,rotationY:0,duration:.9},22.65);
  words($('#l6a'),22.8,.07);
  tl.fromTo('#n1',{autoAlpha:0,y:-40,scale:.96},{autoAlpha:1,y:0,scale:1,duration:.5,ease:'back.out(1.6)'},23.3);
  words($('#l6b'),24.0,.07);
  tl.to('#n1',{y:112,duration:.4,ease:'power2.inOut'},24.4);
  tl.fromTo('#n2',{autoAlpha:0,y:-40,scale:.96},{autoAlpha:1,y:0,scale:1,duration:.5,ease:'back.out(1.6)'},24.45);
  out('#s6 .lt',25.75);
  tl.to('#phone',{autoAlpha:0,y:40,scale:.95,duration:.45,ease:'power2.in'},25.75);
  tl.to('#halo',{autoAlpha:0,duration:.6},25.7);
  hide('#s6',26.25,.1);

  /* 7 End card 26.2–30 */
  show('#s7',26.15,.1);
  tl.fromTo('#arc',{autoAlpha:0,y:0},{autoAlpha:1,y:-300,duration:1.6},26.2);
  words($('#b7'),26.3,.09);
  tl.fromTo('#b7 svg',{rotation:-120},{rotation:0,duration:.9},26.5);
  out('#b7',27.6,.4);
  tl.fromTo('#logo7',{autoAlpha:0,y:24,filter:'blur(10px)'},{autoAlpha:1,y:0,filter:'blur(0px)',duration:.7},27.85);
  tl.fromTo('#logo7 .star',{scale:0,rotation:-180},{scale:1,rotation:0,duration:.6,ease:'back.out(3)',stagger:.12},28.1);
  tl.fromTo('#btns',{autoAlpha:0,y:20},{autoAlpha:1,y:0,duration:.6},28.45);
  twinkle('#s7',27.9,DUR);
  tl.to({},{duration:.01},DUR);
  return tl;
}

let TL;
const playBtn=$('#play'),scrub=$('#scrub'),timeEl=$('#time'),vo=$('#vo'),sn=$('#sceneName');
const fmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
const setPlayLabel=l=>{playBtn.textContent=l;playBtn.setAttribute('aria-label',l)};
function ui(){const t=TL.time();scrub.value=t;timeEl.textContent=`${fmt(t)} / ${fmt(DUR)}`;
  const v=VO.find(x=>t>=x[0]&&t<x[1]);vo.textContent=v?v[2]:'';
  let n=SCN[0][1];SCN.forEach(s=>{if(t>=s[0])n=s[1]});sn.textContent=n;}
document.getElementById('marks').innerHTML=SCN.slice(1).map(s=>`<i style="left:${s[0]/DUR*100}%"></i>`).join('');
document.fonts.ready.then(()=>{
  fit();TL=build();TL.eventCallback('onUpdate',ui);
  TL.eventCallback('onComplete',()=>setPlayLabel('Replay'));
  TL.seek(0);ui();
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){TL.play();setPlayLabel('Pause')}
});
playBtn.onclick=()=>{if(!TL)return;
  if(TL.progress()>=1){TL.restart();}
  else if(TL.paused()){TL.play();}
  else{TL.pause();}
  setPlayLabel(!TL.paused()&&TL.progress()<1?'Pause':'Play')};
scrub.oninput=()=>{if(!TL)return;TL.pause();TL.seek(+scrub.value);setPlayLabel('Play');ui()};
$('#cc').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);vo.classList.toggle('on',on)};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();playBtn.click()}});
</script>
</body>
</html>
