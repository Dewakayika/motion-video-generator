}
:root[data-theme="dark"]{ --chrome-bg:#040C1C; --chrome-fg:#E6FFF1; --chrome-muted:#8EA0BD; --chrome-panel:#0A1730; --chrome-line:#1B2C4A; }

function split(el){
  const walk=n=>{[...n.childNodes].forEach(c=>{
    if(c.nodeType===3){const f=document.createDocumentFragment();c.textContent.split(/(\s+)/).forEach(t=>{if(!t)return;if(/^\s+$/.test(t)){f.appendChild(document.createTextNode(t))}else{const s=document.createElement('span');s.className='w';s.textContent=t;f.appendChild(s)}});c.replaceWith(f)}
    else if(c.nodeType===1&&!c.classList.contains('w'))walk(c)})};
  walk(el);return el.querySelectorAll('.w');
}

  tl.to('#jaScroll',{y:JA_SCROLL,duration:1.0,ease:'power3.inOut'},50.1);
  cam2To(50.1,1.1,1132,560,1.0);
  tl.fromTo('#jaNew',{autoAlpha:0,x:-16},{autoAlpha:1,x:0,duration:.4},50.75);
  tl.to('#cam2',{autoAlpha:0,y:'+=60',duration:.45,ease:'power2.in'},51.25);
  tl.to('#halo',{autoAlpha:0,duration:.6},51.1);
  hide('#s6',51.85,.1);

  /* 10 End card 51.8–60 */
  show('#s7',51.75,.1);
  tl.fromTo('#arc',{autoAlpha:0,y:0},{autoAlpha:1,y:-300,duration:1.8},51.8);
  words($('#b7'),52.0,.1);
  tl.fromTo('#b7 svg',{rotation:-120},{rotation:0,duration:.9},52.2);
  out('#b7',54.4,.45);
  tl.fromTo('#logo7',{autoAlpha:0,y:24,filter:'blur(10px)'},{autoAlpha:1,y:0,filter:'blur(0px)',duration:.8},54.75);
  tl.fromTo('#logo7 .star',{scale:0,rotation:-180},{scale:1,rotation:0,duration:.6,ease:'back.out(3)',stagger:.12},55.05);
  tl.fromTo('#btns',{autoAlpha:0,y:20},{autoAlpha:1,y:0,duration:.6},55.5);
  twinkle('#s7',54.8,DUR);
  tl.to({},{duration:.01},DUR);
  return tl;
}

let TL;
const playBtn=$('#play'),scrub=$('#scrub'),timeEl=$('#time'),vo=$('#vo'),sn=$('#sceneName');
const fmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
const setPlayLabel=l=>{playBtn.textContent=l;playBtn.setAttribute('aria-label',l)};
function ui(){const t=TL.time();scrub.value=t;timeEl.textContent=`${fmt(t)} / ${fmt(DUR)}`;
  const v=VO.find(x=>t>=x[0]&&t<x[1]);vo.textContent=v?v[2]:'';
  let n=SCN[0][1];SCN.forEach(s=>{if(t>=s[0])n=s[1]});sn.textContent=n;}
document.getElementById('marks').innerHTML=SCN.slice(1).map(s=>`<i style="left:${s[0]/DUR*100}%"></i>`).join('');
document.fonts.ready.then(()=>{
  fit();TL=build();TL.eventCallback('onUpdate',ui);
  TL.eventCallback('onComplete',()=>setPlayLabel('Replay'));
  TL.seek(0);ui();
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){TL.play();setPlayLabel('Pause')}
});
playBtn.onclick=()=>{if(!TL)return;
  if(TL.progress()>=1){TL.restart();}
  else if(TL.paused()){TL.play();}
  else{TL.pause();}
  setPlayLabel(!TL.paused()&&TL.progress()<1?'Pause':'Play')};
scrub.oninput=()=>{if(!TL)return;TL.pause();TL.seek(+scrub.value);setPlayLabel('Play');ui()};
$('#cc').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);vo.classList.toggle('on',on)};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();playBtn.click()}});
</script>
