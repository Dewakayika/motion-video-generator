<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Genuine Solutions · 60s bumper animatic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{
  --chrome-bg:#E9EEF5; --chrome-fg:#09295C; --chrome-muted:#5B6B86; --chrome-panel:#FFFFFF; --chrome-line:#D5DDE8;
  --navy:#09295C; --deep:#061A3A; --green:#41FF95; --mint:#E6FFF1; --ink:#0A2148; --muted:#5B6B86; --line:#E3E8F0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --chrome-bg:#040C1C; --chrome-fg:#E6FFF1; --chrome-muted:#8EA0BD; --chrome-panel:#0A1730; --chrome-line:#1B2C4A; }
}
:root[data-theme="dark"]{ --chrome-bg:#040C1C; --chrome-fg:#E6FFF1; --chrome-muted:#8EA0BD; --chrome-panel:#0A1730; --chrome-line:#1B2C4A; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--chrome-bg);color:var(--chrome-fg);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#viewport{position:relative;width:min(calc(100vw - 32px),calc((100vh - 130px) * 16 / 9));aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#040f24;box-shadow:0 20px 60px rgba(4,12,28,.35)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,sans-serif}

/* controls */
#controls{width:min(calc(100vw - 32px),calc((100vh - 130px) * 16 / 9));display:flex;align-items:center;gap:14px;background:var(--chrome-panel);border:1px solid var(--chrome-line);border-radius:12px;padding:10px 14px}
#controls button{font:inherit;font-size:14px;font-weight:600;color:var(--chrome-fg);background:transparent;border:1px solid var(--chrome-line);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
#controls button:focus-visible,#scrub:focus-visible{outline:2px solid #41FF95;outline-offset:2px}
#controls button[aria-pressed="true"]{background:#41FF95;color:#061A3A;border-color:#41FF95}
#time{font-variant-numeric:tabular-nums;font-size:14px;color:var(--chrome-muted);min-width:92px}
#track{position:relative;flex:1;display:flex;align-items:center}
#scrub{width:100%;accent-color:#41FF95;margin:0}
#marks{position:absolute;left:0;right:0;top:-9px;height:6px;pointer-events:none}
#marks i{position:absolute;top:0;width:2px;height:6px;background:var(--chrome-muted);opacity:.6;border-radius:1px}
#sceneName{font-size:13px;color:var(--chrome-muted);min-width:150px;text-align:right}
@media (max-width:700px){#sceneName{display:none}}

/* backgrounds */
.bg{position:absolute;inset:0}
#bgDark{background:radial-gradient(120% 90% at 50% 120%,#0d3c70 0%,#061A3A 55%,#030c1f 100%)}
#arc{position:absolute;left:50%;bottom:-980px;width:2000px;height:1300px;margin-left:-1000px;border-radius:50%;border-top:5px solid rgba(65,255,149,.6);box-shadow:0 -50px 180px rgba(65,255,149,.32),inset 0 50px 140px rgba(65,255,149,.16)}
#bgLight{opacity:0;visibility:hidden;background:radial-gradient(80% 75% at 12% 0%,rgba(65,255,149,.30),transparent 62%),radial-gradient(70% 70% at 100% 100%,rgba(9,41,92,.10),transparent 60%),#fff}
#particles{position:absolute;inset:0;pointer-events:none}
#particles span{position:absolute;color:#41FF95;opacity:.55;animation:float 7s ease-in-out infinite}
#particles span svg{width:100%;height:100%;display:block}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-18px) rotate(25deg)}}
@media (prefers-reduced-motion: reduce){#particles span{animation:none}}

.scene{position:absolute;inset:0;opacity:0;visibility:hidden}
.beat{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;margin:0;font-size:84px;font-weight:600;letter-spacing:-.025em;color:#fff;line-height:1.12;padding:0 120px}
.beat em,.dk em{font-style:normal;color:#41FF95}
.w{display:inline-block;opacity:0;will-change:transform}
.star svg{display:block;width:100%;height:100%}

/* logo (recreated; swap with official SVG in production) */
.logo{display:inline-flex;flex-direction:column;align-items:flex-end;color:#fff;line-height:1}
.logo .lw{font-size:150px;font-weight:600;letter-spacing:-.03em;position:relative}
.logo .lg{color:#41FF95;position:relative}
.logo .lg .star{position:absolute;width:.26em;height:.26em;left:.2em;top:.38em;color:#41FF95}
.logo .li{position:relative}
.logo .li .star{position:absolute;width:.2em;height:.2em;left:-.01em;top:-.12em;color:#41FF95}
.logo .ls{font-size:50px;font-weight:500;letter-spacing:.04em;margin-top:6px}

/* pills */
.prow{position:absolute;left:0;display:flex;gap:22px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:14px;height:78px;padding:0 38px;border-radius:999px;border:1.5px solid rgba(65,255,149,.35);color:#DFFFEE;font-size:30px;font-weight:500;background:rgba(255,255,255,.04)}
.pill.on{background:#41FF95;color:#061A3A;border-color:#41FF95;box-shadow:0 0 44px rgba(65,255,149,.45)}
.pgrid{position:absolute;left:0;right:0;top:470px;display:flex;flex-direction:column;align-items:center;gap:22px}
.pgrid .r{display:flex;gap:22px}
.badge{display:inline-flex;align-items:center;gap:12px;color:#fff;font-size:26px;font-weight:500;padding:14px 26px;border-radius:999px;background:rgba(9,41,92,.75);border:1px solid rgba(65,255,149,.3)}
.badge .star{width:20px;height:20px;color:#41FF95}
#sweep{position:absolute;left:0;top:0;bottom:0;width:100%;background:#41FF95;transform-origin:0 50%;transform:scaleX(0)}

/* UI kit (brand-themed recreation of app.genuinesolutions.com.au) */
.ui{background:#fff;border-radius:22px;box-shadow:0 40px 90px rgba(9,41,92,.18),0 2px 6px rgba(9,41,92,.08);overflow:hidden;color:#0A2148}
.dash{display:grid;grid-template-columns:300px 1fr;width:2000px;height:1200px}
.side{border-right:1px solid #E3E8F0;padding:34px 22px;font-size:20px;background:#fff}
.side .brand{font-weight:700;font-size:24px;color:#09295C;margin:0 12px 22px}
.side .brand b{color:#1fd67a}
.nav-h{color:#5B6B86;font-size:15px;margin:22px 14px 6px}
.nav-i{padding:12px 14px;border-radius:12px;color:#34465F}
.nav-i.act{background:#E6FFF1;color:#09295C;font-weight:600;box-shadow:inset 4px 0 0 #41FF95}
.main{padding:40px 52px;background:#F7F9FC;position:relative}
.crumb{font-size:17px;color:#5B6B86;margin-bottom:12px}
.h2{font-size:44px;font-weight:700;letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:16px}
.sub{font-size:20px;color:#5B6B86;margin:8px 0 28px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:26px}
.stat{background:#fff;border:1px solid #E3E8F0;border-radius:18px;padding:24px}
.stat small{display:block;font-size:18px;color:#34465F;font-weight:600}
.stat b{display:block;font-size:48px;margin-top:10px;color:#09295C}
.stat span{font-size:15px;color:#5B6B86}
.panel{background:#fff;border:1px solid #E3E8F0;border-radius:18px;padding:24px 28px}
.panel-h{font-size:22px;font-weight:700;margin-bottom:14px}
.trow{display:grid;grid-template-columns:2fr .6fr 1fr 1.6fr;align-items:center;gap:16px;padding:18px 4px;border-top:1px solid #EEF1F5;font-size:19px}
.trow.th{border-top:0;color:#5B6B86;font-size:15px;font-weight:600;padding-top:0}
.trow small{display:block;color:#1F8F55;font-size:15px;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 15px;border-radius:999px;font-size:16px;font-weight:600;white-space:nowrap}
.chip.review{background:#E6EEFF;color:#1F4FBF}
.chip.done{background:#D9FBE8;color:#0B7A43}
.chip.todo{background:#EEF1F5;color:#5B6B86}
.chip.teal{background:#D5F6F1;color:#08776A}
.chipswap{position:relative;display:inline-block;height:32px;width:150px}
.chipswap .chip{position:absolute;left:0;top:0}
.chipswap .chip.done{opacity:0}
.jobhead{display:flex;align-items:center;gap:22px;margin-bottom:22px}
.av{width:84px;height:84px;border-radius:50%;background:#EEF2F8;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:28px;color:#09295C;flex:none}
.av.sm{width:56px;height:56px;font-size:19px}
.jobhead .sub{margin:6px 0 0}
.tabs{display:flex;gap:44px;border-bottom:1px solid #E3E8F0;margin-bottom:26px;font-size:21px;color:#34465F}
.tabs span{padding:14px 2px;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs span.act{color:#09295C;font-weight:700;border-color:#41FF95}
.tabbody{position:relative}
.view{position:absolute;left:0;right:0;top:0}
.view.find{opacity:0}
.g2{display:grid;grid-template-columns:1.35fr 1fr;gap:24px}
.card{background:#fff;border:1px solid #E3E8F0;border-radius:18px;padding:26px 28px;margin-bottom:24px}
.card h4{margin:0 0 16px;font-size:21px}
.kv{display:grid;grid-template-columns:200px 1fr;row-gap:14px;font-size:19px}
.kv span:nth-child(odd){color:#5B6B86}
.sk{display:flex;flex-wrap:wrap;gap:10px}
.sk span{padding:6px 14px;border-radius:999px;background:#EEF1F5;color:#34465F;font-size:16px;font-weight:600}
.sk span.m{background:#D9FBE8;color:#0B7A43}
.desc{font-size:18px;color:#34465F;line-height:1.6;margin:16px 0 0;padding-left:22px}
.money{font-size:34px;font-weight:700;color:#09295C;margin:6px 0 18px}
.money small{font-size:18px;color:#5B6B86;font-weight:500}
.lbl{font-size:17px;color:#5B6B86;margin-bottom:8px}
.gfind{display:grid;grid-template-columns:420px 1fr;gap:24px}
.crit .row{display:flex;justify-content:space-between;padding:14px 0;border-top:1px solid #EEF1F5;font-size:18px}
.crit .row span:first-child{color:#5B6B86}
.crit .row span:last-child{font-weight:600;text-align:right}
.cand{display:grid;grid-template-columns:36px 56px 1fr auto;gap:18px;align-items:center;background:#fff;border:1px solid #E3E8F0;border-radius:18px;padding:22px 24px;margin-bottom:16px}
.cand b{font-size:21px}
.cand .hl{display:block;color:#5B6B86;font-size:17px;margin:2px 0 10px}
.chk{width:30px;height:30px;border-radius:8px;border:2px solid #C3CCDA;background:#fff;position:relative}
.chk.on{background:#09295C;border-color:#09295C}
.chk.on::after{content:"";position:absolute;left:9px;top:4px;width:7px;height:14px;border:solid #41FF95;border-width:0 3px 3px 0;transform:rotate(45deg)}
.smatch{font-size:17px;color:#34465F;background:#F2F5F9;border-radius:12px;padding:10px 14px;white-space:nowrap}
.smatch b{color:#0B7A43}
.selbar{position:absolute;left:50%;bottom:-560px;transform:translateX(-50%);display:flex;align-items:center;gap:22px;background:#09295C;color:#fff;border-radius:999px;padding:12px 12px 12px 30px;font-size:19px;opacity:0;box-shadow:0 20px 50px rgba(9,41,92,.35)}
.selbar .btn{background:#41FF95;color:#061A3A;font-weight:700;border-radius:999px;padding:14px 26px}
.cnt{font-size:17px;color:#5B6B86;margin-bottom:14px}

/* overlay pieces */
.lift{position:absolute;opacity:0;visibility:hidden;border-radius:18px;box-shadow:0 0 0 2px #41FF95,0 40px 90px rgba(9,41,92,.28);background:#fff;z-index:5}
.lift .card{margin:0;border:0}
.veil{position:absolute;inset:0;background:rgba(255,255,255,.5);opacity:0;visibility:hidden;z-index:4}
.cap{position:absolute;left:140px;bottom:96px;display:inline-flex;align-items:center;gap:16px;background:#09295C;color:#fff;border-radius:999px;padding:22px 38px;font-size:34px;font-weight:600;letter-spacing:-.01em;z-index:8;opacity:0;visibility:hidden;box-shadow:0 24px 60px rgba(9,41,92,.35)}
.cap em{font-style:normal;color:#41FF95}
.cap .star{width:26px;height:26px;color:#41FF95}
.critwrap{position:absolute;left:0;right:0;top:360px;display:flex;flex-direction:column;align-items:center;gap:40px;z-index:6}
.critwrap h3{margin:0;font-size:72px;font-weight:700;letter-spacing:-.025em;color:#09295C;opacity:0}
.critwrap h3 em,.lbeat em{font-style:normal;background:linear-gradient(transparent 60%,rgba(65,255,149,.75) 60%)}
.crow{display:flex;gap:18px}
.cchip{display:flex;align-items:center;gap:14px;background:#fff;border-radius:999px;padding:16px 26px 16px 18px;font-size:26px;font-weight:600;color:#09295C;box-shadow:0 16px 40px rgba(9,41,92,.16);opacity:0}
.cchip i{width:32px;height:32px;border-radius:50%;background:#E3E8F0;position:relative;flex:none}
.cchip i::after{content:"";position:absolute;left:11px;top:6px;width:7px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
#ripple{position:absolute;width:120px;height:120px;border-radius:50%;background:#41FF95;opacity:0;visibility:hidden;z-index:30}

/* screens stack (scene 4) */
.screen{position:absolute;width:1200px;height:740px;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 50px 100px rgba(9,41,92,.22),0 2px 8px rgba(9,41,92,.08)}
.screen .inner{transform:scale(.6);transform-origin:0 0;width:2000px}
.s4h{position:absolute;left:0;right:0;top:86px;text-align:center;font-size:72px;font-weight:700;letter-spacing:-.025em;color:#09295C;margin:0}

/* kanban (scene 8) */
.stages{position:absolute;left:150px;top:250px}
.stg{display:flex;align-items:center;gap:22px;height:96px;font-size:32px;font-weight:600;color:#9AA7BC}
.stg i{width:22px;height:22px;border-radius:50%;border:3px solid #C3CCDA;background:#fff;flex:none}
.stg.act{color:#09295C}
.stg.act i{background:#41FF95;border-color:#41FF95;box-shadow:0 0 0 8px rgba(65,255,149,.25)}
.stg.done{color:#5B6B86}
.stg.done i{background:#09295C;border-color:#09295C}
.kpanel{position:absolute;left:640px;top:140px;width:1160px;height:800px}
.kpanel .kh{position:absolute;left:32px;top:30px;font-size:28px;font-weight:700}
.kpanel .kh small{display:block;font-size:18px;font-weight:500;color:#5B6B86;margin-top:4px}
.kcol{position:absolute;top:110px;width:352px;height:660px;border-radius:18px;background:#F4F7FB}
.kcol .chip{position:absolute;left:16px;top:16px;font-size:18px}
.kcard{position:absolute;width:320px;height:150px;background:#fff;border:1px solid #E3E8F0;border-radius:16px;padding:18px;box-shadow:0 4px 12px rgba(9,41,92,.06)}
.kcard b{font-size:20px;display:block}
.kcard span{font-size:15px;color:#5B6B86}
.kcard .sk{margin-top:12px}
.kcard .sk span{font-size:13px;padding:4px 10px}
.modal{position:absolute;left:320px;top:250px;width:520px;background:#fff;border-radius:20px;padding:30px;box-shadow:0 30px 80px rgba(9,41,92,.3);opacity:0;visibility:hidden;z-index:6;font-size:21px;text-align:center}
.modal .acts{display:flex;gap:14px;margin-top:24px}
.modal .acts span{flex:1;padding:14px;border-radius:12px;border:1px solid #E3E8F0;font-weight:600}
.modal .acts span.pri{background:#09295C;color:#fff;border-color:#09295C}
.mveil{position:absolute;inset:0;background:rgba(6,26,58,.35);opacity:0;visibility:hidden;z-index:5}
.sheet{position:absolute;right:0;top:0;bottom:0;width:540px;background:#fff;border-left:1px solid #E3E8F0;padding:34px;z-index:7;box-shadow:-30px 0 60px rgba(9,41,92,.12)}
.sheet .top{display:flex;align-items:center;gap:16px}
.sheet .top b{font-size:26px;display:block}
.sheet h5{font-size:17px;color:#5B6B86;margin:28px 0 10px;font-weight:600}
.sheet p{font-size:19px;line-height:1.55;margin:0;color:#34465F}

/* phone (scene 9) */
.lbeat{position:absolute;left:170px;top:50%;transform:translateY(-50%);width:820px;margin:0;font-size:80px;font-weight:700;letter-spacing:-.03em;color:#09295C;line-height:1.08;opacity:0;visibility:hidden}
.phone{position:absolute;left:1120px;top:110px;width:420px;height:860px;border-radius:60px;border:12px solid #0B1A33;background:#fff;overflow:hidden;box-shadow:0 50px 110px rgba(9,41,92,.3)}
.ps{position:absolute;inset:0;padding:70px 30px 30px;opacity:0;visibility:hidden;color:#0A2148}
.ps h6{font-size:28px;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.ps .s{font-size:16px;color:#5B6B86;margin-bottom:26px}
.fld{font-size:15px;color:#34465F;margin-bottom:6px;font-weight:600}
.inp{height:54px;border:1px solid #D5DDE8;border-radius:12px;padding:0 16px;display:flex;align-items:center;font-size:17px;margin-bottom:18px}
.inp .t{display:inline-block;white-space:nowrap;clip-path:inset(0 100% 0 0)}
.pbtn{height:58px;border-radius:14px;background:#09295C;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.drop{border:2px dashed #C3CCDA;border-radius:18px;height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#5B6B86;font-size:16px}
.drop .ic{width:60px;height:60px;border-radius:16px;background:#E6FFF1;display:flex;align-items:center;justify-content:center;color:#09295C;font-size:30px;font-weight:700}
.file{margin-top:18px;border:1px solid #E3E8F0;border-radius:14px;padding:14px 16px;font-size:16px;opacity:0}
.file small{display:block;color:#5B6B86;font-size:14px;margin-top:2px}
.bar{height:6px;border-radius:3px;background:#EEF1F5;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#41FF95;transform-origin:0 50%;transform:scaleX(0)}
.ring{display:flex;flex-direction:column;align-items:center;margin-top:20px}
.ring svg{width:220px;height:220px;transform:rotate(-90deg)}
.ring .num{position:relative;margin-top:-140px;font-size:46px;font-weight:800;color:#09295C;height:110px}
.ring p{font-size:16px;color:#5B6B86;text-align:center;margin:10px 0 0}
.lock{background:linear-gradient(180deg,#0d3c70,#061A3A);color:#fff;text-align:center}
.lock .tm{font-size:92px;font-weight:600;letter-spacing:-.03em;margin-top:40px}
.lock .dt{font-size:20px;opacity:.8}
.notif{position:absolute;left:18px;right:18px;top:300px;background:rgba(255,255,255,.94);color:#0A2148;border-radius:22px;padding:16px 18px;text-align:left;display:flex;gap:14px;align-items:flex-start;opacity:0}
.notif .ap{width:44px;height:44px;border-radius:12px;background:#09295C;color:#41FF95;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none}
.notif b{font-size:16px;display:block}
.notif span{font-size:15px;color:#34465F}
.appcard{border:1px solid #E3E8F0;border-radius:18px;padding:18px}
.appcard b{font-size:19px;display:block}
.appcard span{font-size:14px;color:#5B6B86}
.step{position:relative;display:flex;justify-content:space-between;margin:28px 2px 10px}
.step .ln{position:absolute;left:10px;right:10px;top:9px;height:3px;background:#E3E8F0}
.step .ln i{display:block;height:100%;background:#09295C;transform-origin:0 50%;transform:scaleX(.2)}
.step .d{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #C3CCDA;position:relative;z-index:1}
.step .d.on{background:#09295C;border-color:#09295C}
.step .d.cur{border-color:#41FF95;background:#41FF95;box-shadow:0 0 0 6px rgba(65,255,149,.3)}
.slbl{display:flex;justify-content:space-between;font-size:11px;color:#5B6B86}
.join{margin-top:18px;height:52px;border-radius:14px;background:#41FF95;color:#061A3A;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:17px;opacity:0}

/* end card */
.btns{display:flex;gap:22px}
.gbtn{display:inline-flex;align-items:center;height:84px;padding:0 44px;border-radius:999px;font-size:30px;font-weight:700}
.gbtn.f{background:#41FF95;color:#061A3A;box-shadow:0 0 50px rgba(65,255,149,.5)}
.gbtn.o{border:2px solid #41FF95;color:#DFFFEE}
.endstack{position:absolute;left:0;right:0;top:300px;display:flex;flex-direction:column;align-items:center;gap:46px}
.url{font-size:30px;color:#fff;font-weight:500}
.url small{display:block;text-align:center;color:#8EA0BD;font-size:22px;margin-top:8px}

// split words
function split(el){
  const walk=n=>{[...n.childNodes].forEach(c=>{
    if(c.nodeType===3){const f=document.createDocumentFragment();c.textContent.split(/(\s+)/).forEach(t=>{if(!t)return;if(/^\s+$/.test(t)){f.appendChild(document.createTextNode(t))}else{const s=document.createElement('span');s.className='w';s.textContent=t;f.appendChild(s)}});c.replaceWith(f)}
    else if(c.nodeType===1&&!c.classList.contains('w'))walk(c)})};
  walk(el);return el.querySelectorAll('.w');
}

function liftClone(el,parent){const p=pos(el,0,0,false);const c=document.createElement('div');c.className='lift';c.style.cssText+=`left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px`;c.innerHTML=el.outerHTML;const inner=c.firstElementChild;inner.style.margin='0';inner.style.height='100%';parent.appendChild(c);return c}

let TL;
const playBtn=$('#play'),scrub=$('#scrub'),timeEl=$('#time'),vo=$('#vo'),sn=$('#sceneName');
const fmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
function ui(){const t=TL.time();scrub.value=t;timeEl.textContent=`${fmt(t)} / 1:00`;
  const v=VO.find(x=>t>=x[0]&&t<x[1]);vo.textContent=v?v[2]:'';
  let n=SCN[0][1];SCN.forEach(s=>{if(t>=s[0])n=s[1]});sn.textContent=n;}
document.getElementById('marks').innerHTML=SCN.slice(1).map(s=>`<i style="left:${s[0]/60*100}%"></i>`).join('');
document.fonts.ready.then(()=>{
  fit();TL=build();TL.eventCallback('onUpdate',ui);
  TL.eventCallback('onComplete',()=>{playBtn.textContent='Replay';playBtn.setAttribute('aria-label','Replay')});
  TL.seek(0);ui();
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){TL.play();playBtn.textContent='Pause';playBtn.setAttribute('aria-label','Pause')}
});
playBtn.onclick=()=>{if(!TL)return;
  if(TL.progress()>=1){TL.restart();}
  else if(TL.paused()){TL.play();}
  else{TL.pause();}
  const p=!TL.paused()&&TL.progress()<1;playBtn.textContent=p?'Pause':'Play';playBtn.setAttribute('aria-label',p?'Pause':'Play')};
scrub.oninput=()=>{if(!TL)return;TL.pause();TL.seek(+scrub.value);playBtn.textContent='Play';ui()};
$('#cc').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);vo.classList.toggle('on',on)};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();playBtn.click()}});
</script>
