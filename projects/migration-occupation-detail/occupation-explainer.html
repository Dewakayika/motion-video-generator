<style>
:root{
  --chrome-bg:#E9EEF5; --chrome-fg:#0B2A4A; --chrome-muted:#5B6B80; --chrome-panel:#FFFFFF; --chrome-line:#D5DDE8;
  --bg:#050A16; --panel:#0E1729; --panel2:#131F36; --line:rgba(148,178,230,.16);
  --fg:#EAF1FB; --mut:#93A4BF; --blue:#3B82F6; --sky:#60A5FA; --green:#34D399;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --chrome-bg:#06111F; --chrome-fg:#E6F0FA; --chrome-muted:#8EA0BD; --chrome-panel:#0C1A2E; --chrome-line:#1B2C4A; }
}
:root[data-theme="dark"]{ --chrome-bg:#06111F; --chrome-fg:#E6F0FA; --chrome-muted:#8EA0BD; --chrome-panel:#0C1A2E; --chrome-line:#1B2C4A; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--chrome-bg);color:var(--chrome-fg);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#viewport{position:relative;width:min(calc(100vw - 32px),calc((100vh - 130px) * 16 / 9));aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--bg);box-shadow:0 20px 60px rgba(4,12,28,.35)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--fg);background:var(--bg)}

/* controls */
#controls{width:min(calc(100vw - 32px),calc((100vh - 130px) * 16 / 9));display:flex;align-items:center;gap:14px;background:var(--chrome-panel);border:1px solid var(--chrome-line);border-radius:12px;padding:10px 14px}
#controls button{font:inherit;font-size:14px;font-weight:600;color:var(--chrome-fg);background:transparent;border:1px solid var(--chrome-line);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
#controls button:focus-visible,#scrub:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#time{font-variant-numeric:tabular-nums;font-size:14px;color:var(--chrome-muted);min-width:92px}
#track{position:relative;flex:1;display:flex;align-items:center}
#scrub{width:100%;accent-color:var(--blue);margin:0}
#marks{position:absolute;left:0;right:0;top:-9px;height:6px;pointer-events:none}
#marks i{position:absolute;top:0;width:2px;height:6px;background:var(--chrome-muted);opacity:.6;border-radius:1px}
#sceneName{font-size:13px;color:var(--chrome-muted);min-width:190px;text-align:right}
@media (max-width:700px){#sceneName{display:none}}

/* background */
.bg{position:absolute;inset:0}
.blob{position:absolute;border-radius:50%;filter:blur(110px)}
#blobA{left:-300px;top:-340px;width:1000px;height:1000px;background:rgba(59,130,246,.12)}

.scene{position:absolute;inset:0;opacity:0;visibility:hidden}
.w{display:inline-block;opacity:0;will-change:transform}
.eyebrow{display:inline-flex;align-items:center;font-size:20px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);opacity:0}
.h{margin:0;font-size:80px;font-weight:600;letter-spacing:-.03em;line-height:1.08;color:var(--fg)}
.h em{font-style:normal;color:var(--sky)}

/* 1 Intro */
#s1 .c{position:absolute;left:0;right:0;top:300px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:30px}
#s1 .sub{font-size:30px;color:var(--mut);opacity:0}
#s1 .sub b{color:var(--fg);font-weight:600}
#logo1{position:absolute;left:50%;top:150px;height:58px;transform:translateX(-50%);opacity:0}

/* 2 What the page answers */
#t2{position:absolute;left:150px;top:150px;display:flex;flex-direction:column;gap:18px}
#t2 .h{font-size:60px}
#map{position:absolute;left:150px;top:350px;width:900px;padding:34px 38px;border-radius:30px;background:linear-gradient(180deg,#121D33,#0C1528);border:1px solid var(--line);box-shadow:0 40px 90px rgba(0,0,0,.45);opacity:0;visibility:hidden}
#map .ttl{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
#map .ttl b{font-size:28px;font-weight:600}
#map .ttl b small{font-size:20px;color:var(--mut);font-weight:600;margin-right:12px}
#map .ttl span{font-size:17px;font-weight:500;color:var(--mut);padding:7px 14px;border-radius:999px;border:1px solid var(--line)}
.srow{display:grid;grid-template-columns:230px 1fr;align-items:center;padding:18px 0;border-top:1px solid var(--line);opacity:0}
.srow .v b{display:block;font-size:24px;font-weight:600}
.srow .v span{font-size:17px;color:var(--mut)}
.srow .chips{display:flex;flex-wrap:wrap;gap:8px}
.srow .chips i{font-style:normal;font-size:18px;font-weight:500;padding:5px 12px;border-radius:9px;border:1px solid var(--line);color:var(--fg);background:#0A1222}
.srow .chips i.nat{border-color:rgba(96,165,250,.5);background:rgba(59,130,246,.16)}
#qs{position:absolute;left:1120px;top:350px;width:660px;display:flex;flex-direction:column;gap:22px}
.q{display:flex;gap:22px;align-items:flex-start;padding:26px 28px;border-radius:22px;background:var(--panel);border:1px solid var(--line);opacity:0;visibility:hidden}
.q .n{flex:none;width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:500;color:#fff;background:var(--blue)}
.q b{display:block;font-size:28px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.q span{display:block;margin-top:6px;font-size:20px;color:var(--mut)}

/* dashboard window + camera */
#win{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:50% 50%;border-radius:22px;overflow:hidden;background:#0A0F1C;box-shadow:0 50px 120px rgba(0,0,0,.6),0 0 0 1px rgba(148,178,230,.18);opacity:0;visibility:hidden}
#view{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#080C17}
#cam{position:absolute;left:0;top:0;width:1920px;transform-origin:0 0}
.shot{position:absolute;left:0;top:0;width:1920px;display:block;opacity:0;visibility:hidden}
.spot{position:absolute;border-radius:14px;border:1.5px solid var(--sky);box-shadow:0 0 0 6000px rgba(3,6,16,.68);opacity:0;visibility:hidden;pointer-events:none}

/* callouts (screen space) */
#cos{position:absolute;inset:0;pointer-events:none}
.co{position:absolute;padding:24px 28px;border-radius:18px;background:rgba(12,19,34,.96);border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 60px rgba(0,0,0,.45);opacity:0;visibility:hidden}
.co .k{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.co .k i{width:8px;height:8px;border-radius:50%;background:var(--sky)}
.co b{display:block;margin-top:10px;font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.co p{margin:10px 0 0;font-size:21px;line-height:1.45;color:#B7C5DB}
.co p em{font-style:normal;color:var(--fg);font-weight:500}
.st{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.st div{display:flex;align-items:baseline;gap:14px;font-size:21px;color:#B7C5DB;line-height:1.4}
.st div b{flex:none;display:inline-flex;align-items:center;gap:8px;margin:0;font-size:21px;font-weight:600;min-width:180px;color:var(--fg)}
.st div b i{width:10px;height:10px;border-radius:50%}
#cursor{position:absolute;left:0;top:0;width:40px;height:40px;opacity:0;visibility:hidden;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
#cursor svg{width:100%;height:100%;display:block}
#ripple{position:absolute;left:0;top:0;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:3px solid var(--sky);opacity:0;visibility:hidden}

/* outro */
#s15 .c{position:absolute;left:0;right:0;top:140px;display:flex;flex-direction:column;align-items:center;text-align:center}
#s15 .h{font-size:72px}
#rules{display:grid;grid-template-columns:repeat(3,500px);gap:30px;margin-top:64px}
.rule{padding:36px 36px 38px;border-radius:26px;background:var(--panel);border:1px solid var(--line);text-align:left;opacity:0;visibility:hidden}
.rule .n{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:500;color:var(--fg);border:1px solid rgba(148,178,230,.3)}
.rule b{display:block;margin-top:24px;font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.rule p{margin:12px 0 0;font-size:22px;line-height:1.45;color:var(--mut)}
#logo15{height:52px;margin-top:70px;opacity:0}

/* captions: always on */
#caps{position:absolute;left:0;right:0;bottom:44px;height:100px;pointer-events:none}
.cap{position:absolute;left:50%;bottom:0;transform:translateX(-50%);max-width:1560px;width:max-content;padding:18px 36px;border-radius:16px;background:rgba(6,10,20,.86);border:1px solid rgba(255,255,255,.08);font-size:34px;font-weight:500;line-height:1.3;letter-spacing:-.01em;text-align:center;color:#F3F7FD;opacity:0;visibility:hidden}
.cap em{font-style:normal;color:var(--sky)}
</style>
</head>

// Voiceover retiming, written by vo.py: [[original time, new time], ...]. Empty = original timing.
// Each stretch between two anchors plays the original animation slower, so the scene waits for the voice.
const WARP=[];
const OUT=WARP.length?WARP[WARP.length-1][1]:DUR;
function unwarp(t){if(!WARP.length)return t;
  for(let i=0;i<WARP.length-1;i++){const[a,na]=WARP[i],[b,nb]=WARP[i+1];if(t<=nb)return a+(b-a)*Math.max(0,t-na)/(nb-na)}
  return DUR}
function rewarp(t){if(!WARP.length)return t;
  for(let i=0;i<WARP.length-1;i++){const[a,na]=WARP[i],[b,nb]=WARP[i+1];if(t<=b)return na+(nb-na)*Math.max(0,t-a)/(b-a)}
  return OUT}
function retime(inner){if(!WARP.length)return inner;
  // a setter, not an onUpdate callback: seek() suppresses callbacks, and render.py drives the page with seek()
  let now=0;const clock={get t(){return now},set t(v){now=v;inner.seek(unwarp(v))}};
  const m=gsap.timeline({paused:true});
  m.fromTo(clock,{t:0},{t:OUT,duration:OUT,ease:'none',immediateRender:false},0);
  return m}

Promise.all([document.fonts.ready,...imgs]).then(()=>{
  fit();TL=retime(build());scrub.max=OUT;TL.eventCallback('onUpdate',ui);
  TL.eventCallback('onComplete',()=>setPlayLabel('Replay'));
  TL.seek(0);ui();
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){TL.play();setPlayLabel('Pause')}
});
playBtn.onclick=()=>{if(!TL)return;
  if(TL.progress()>=1){TL.restart();}
  else if(TL.paused()){TL.play();}
  else{TL.pause();}
  setPlayLabel(!TL.paused()&&TL.progress()<1?'Pause':'Play')};
scrub.oninput=()=>{if(!TL)return;TL.pause();TL.seek(+scrub.value);setPlayLabel('Play');ui()};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();playBtn.click()}});
</script>
</body>
</html>
