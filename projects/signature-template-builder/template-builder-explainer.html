<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Template Builder Explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{
  --chrome-bg:#E9EEF5; --chrome-fg:#0B2A4A; --chrome-muted:#5B6B80; --chrome-panel:#FFFFFF; --chrome-line:#D5DDE8;
  --bg:#F3F6FB; --panel:#FFFFFF; --line:#DCE4EF; --fg:#0F2440; --mut:#5B6B80;
  --blue:#3467AD; --sky:#2F6FD6; --tint:#EAF1FB; --orange:#C2620A; --green:#0F8A5F;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --chrome-bg:#06111F; --chrome-fg:#E6F0FA; --chrome-muted:#8EA0BD; --chrome-panel:#0C1A2E; --chrome-line:#1B2C4A; }
}
:root[data-theme="dark"]{ --chrome-bg:#06111F; --chrome-fg:#E6F0FA; --chrome-muted:#8EA0BD; --chrome-panel:#0C1A2E; --chrome-line:#1B2C4A; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--chrome-bg);color:var(--chrome-fg);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#viewport{position:relative;width:min(calc(100vw - 32px),calc((100vh - 130px) * 16 / 9));aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--bg);box-shadow:0 20px 60px rgba(4,12,28,.18)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--fg);background:var(--bg)}

/* controls */
#controls{width:min(calc(100vw - 32px),calc((100vh - 130px) * 16 / 9));display:flex;align-items:center;gap:14px;background:var(--chrome-panel);border:1px solid var(--chrome-line);border-radius:12px;padding:10px 14px}
#controls button{font:inherit;font-size:14px;font-weight:600;color:var(--chrome-fg);background:transparent;border:1px solid var(--chrome-line);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
#controls button:focus-visible,#scrub:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#time{font-variant-numeric:tabular-nums;font-size:14px;color:var(--chrome-muted);min-width:92px}
#track{position:relative;flex:1;display:flex;align-items:center}
#scrub{width:100%;accent-color:var(--blue);margin:0}
#marks{position:absolute;left:0;right:0;top:-9px;height:6px;pointer-events:none}
#marks i{position:absolute;top:0;width:2px;height:6px;background:var(--chrome-muted);opacity:.6;border-radius:1px}
#sceneName{font-size:13px;color:var(--chrome-muted);min-width:190px;text-align:right}
@media (max-width:700px){#sceneName{display:none}}

/* background */
.bg{position:absolute;inset:0}
.blob{position:absolute;border-radius:50%;filter:blur(120px)}
#blobA{left:-260px;top:-320px;width:1000px;height:1000px;background:rgba(52,103,173,.14)}
#blobB{right:-300px;bottom:-380px;width:900px;height:900px;background:rgba(47,111,214,.08)}

.scene{position:absolute;inset:0;opacity:0;visibility:hidden}
.w{display:inline-block;opacity:0;will-change:transform}
.eyebrow{display:inline-flex;align-items:center;font-size:20px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);opacity:0}
.h{margin:0;font-size:80px;font-weight:600;letter-spacing:-.03em;line-height:1.08;color:var(--fg)}
.h em{font-style:normal;color:var(--blue)}
code,.tok{font-family:'JetBrains Mono',Consolas,monospace;font-size:.92em}

/* 1 Intro */
#s1 .c{position:absolute;left:0;right:0;top:300px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:30px}
#s1 .sub{font-size:30px;color:var(--mut);opacity:0}
#s1 .sub b{color:var(--fg);font-weight:600}
#logo1{position:absolute;left:50%;top:150px;height:58px;transform:translateX(-50%);opacity:0}

/* shared title block for concept scenes */
.t{position:absolute;left:150px;top:140px;display:flex;flex-direction:column;gap:18px}
.t .h{font-size:60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:26px;box-shadow:0 30px 70px rgba(15,36,64,.10);opacity:0;visibility:hidden}

/* 2 Four jobs */
#jobs{position:absolute;left:150px;top:340px;display:grid;grid-template-columns:repeat(4,1fr);gap:28px;width:1620px}
.job{padding:34px 32px 36px}
.job .n{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:#fff;background:var(--blue)}
.job b{display:block;margin-top:26px;font-size:32px;font-weight:600;letter-spacing:-.02em}
.job p{margin:12px 0 0;font-size:21px;line-height:1.45;color:var(--mut)}
#jobsFoot{position:absolute;left:150px;top:720px;width:1620px;padding:24px 30px;font-size:24px;color:var(--fg);display:flex;align-items:center;gap:16px}
#jobsFoot i{flex:none;width:12px;height:12px;border-radius:50%;background:var(--green)}

/* 3 Variable types */
#vars{position:absolute;left:150px;top:340px;width:1620px;padding:10px 40px}
.vrow{display:grid;grid-template-columns:520px 360px 1fr;align-items:center;padding:26px 0;border-top:1px solid var(--line);opacity:0}
.vrow:first-child{border-top:0}
.vrow .tok{display:inline-block;font-size:26px;padding:10px 18px;border-radius:12px;background:var(--tint);color:var(--blue);border:1px solid #CFDDF2}
.vrow b{font-size:28px;font-weight:600}
.vrow span{font-size:22px;color:var(--mut)}
#rule0{position:absolute;left:150px;top:800px;width:1620px;padding:24px 30px;display:flex;align-items:center;gap:18px;font-size:26px;font-weight:500;border-color:#F3D9BD;background:#FFF8F0}
#rule0 svg{flex:none;width:32px;height:32px;color:var(--orange)}

/* 10 Calculation */
#calc{position:absolute;left:150px;top:330px;width:1100px;padding:30px 40px}
#calc table{width:100%;border-collapse:collapse;font-size:24px}
#calc th{text-align:left;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:0 0 16px}
#calc td{padding:18px 0;border-top:1px solid var(--line)}
#calc td.r,#calc th.r{text-align:right}
#calc td.c,#calc th.c{text-align:center}
#calc tr{opacity:0}
#calc tr.head{opacity:1}
#calc tr.tot td{font-weight:600;font-size:28px;color:var(--blue);border-top:2px solid var(--fg)}
#units{position:absolute;left:1300px;top:330px;width:470px;padding:30px 34px}
#units .k{font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
#units div.u{display:flex;justify-content:space-between;gap:10px;padding:16px 0;border-top:1px solid var(--line);font-size:21px;opacity:0}
#units div.u:first-of-type{margin-top:14px}
#units div.u b{font-weight:600}
#units div.u span{color:var(--mut);text-align:right}

/* 12 Create Agreement */
#form{position:absolute;left:150px;top:330px;width:820px;padding:32px 36px}
#form .ttl{font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:18px}
.fstep{padding:18px 20px;border-radius:16px;border:1px solid var(--line);margin-top:12px;font-size:22px;color:var(--mut);opacity:0}
.fstep.new{border-color:#B9CDEB;background:var(--tint);color:var(--fg)}
.fstep.new b{display:block;font-size:24px;font-weight:600;margin-bottom:10px}
.fstep.new .row{display:flex;gap:10px;flex-wrap:wrap}
.fstep.new .row span{font-size:18px;padding:6px 12px;border-radius:9px;background:#fff;border:1px solid var(--line)}
#snap{position:absolute;left:1030px;top:330px;width:740px;display:flex;flex-direction:column;gap:22px}
.pt{padding:28px 30px}
.pt b{display:block;font-size:28px;font-weight:600;letter-spacing:-.01em}
.pt p{margin:10px 0 0;font-size:21px;line-height:1.45;color:var(--mut)}

/* dashboard window + camera */
#win{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:50% 50%;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 50px 120px rgba(15,36,64,.22),0 0 0 1px rgba(15,36,64,.08);opacity:0;visibility:hidden}
#view{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#F5F7FA}
#cam{position:absolute;left:0;top:0;width:1920px;transform-origin:0 0}
.shot{position:absolute;left:0;top:0;width:1920px;display:block;opacity:0;visibility:hidden}
.spot{position:absolute;border-radius:12px;border:2px solid var(--sky);box-shadow:0 0 0 6000px rgba(15,30,55,.42);opacity:0;visibility:hidden;pointer-events:none}

/* callouts (screen space) */
#cos{position:absolute;inset:0;pointer-events:none}
.co{position:absolute;padding:24px 28px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 24px 60px rgba(15,36,64,.22);opacity:0;visibility:hidden}
.co .k{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}
.co .k i{width:8px;height:8px;border-radius:50%;background:var(--sky)}
.co b{display:block;margin-top:10px;font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15;color:var(--fg)}
.co p{margin:10px 0 0;font-size:21px;line-height:1.45;color:var(--mut)}
.co p em{font-style:normal;color:var(--fg);font-weight:600}
.co.warn{border-color:#F3D9BD;background:#FFF8F0}
.co.warn .k{color:var(--orange)}
.co.warn .k i{background:var(--orange)}
#cursor{position:absolute;left:0;top:0;width:40px;height:40px;opacity:0;visibility:hidden;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
#cursor svg{width:100%;height:100%;display:block}
#ripple{position:absolute;left:0;top:0;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:3px solid var(--sky);opacity:0;visibility:hidden}

/* outro */
#s13 .c{position:absolute;left:0;right:0;top:140px;display:flex;flex-direction:column;align-items:center;text-align:center}
#s13 .h{font-size:72px}
#rules{display:grid;grid-template-columns:repeat(3,500px);gap:30px;margin-top:64px}
.rule{padding:36px 36px 38px;text-align:left}
.rule .n{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:var(--blue);background:var(--tint)}
.rule b{display:block;margin-top:24px;font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.rule p{margin:12px 0 0;font-size:22px;line-height:1.45;color:var(--mut)}
#logo13{height:52px;margin-top:70px;opacity:0}

/* captions: always on */
#caps{position:absolute;left:0;right:0;bottom:44px;height:100px;pointer-events:none}
.cap{position:absolute;left:50%;bottom:0;transform:translateX(-50%);max-width:1560px;width:max-content;padding:18px 36px;border-radius:16px;background:rgba(255,255,255,.97);border:1px solid var(--line);box-shadow:0 14px 40px rgba(15,36,64,.16);font-size:34px;font-weight:500;line-height:1.3;letter-spacing:-.01em;text-align:center;color:var(--fg);opacity:0;visibility:hidden}
.cap em{font-style:normal;color:var(--blue);font-weight:600}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div class="bg"><div class="blob" id="blobA"></div><div class="blob" id="blobB"></div></div>
    <div id="scenes"></div>
    <div id="win">
      <div id="view"><div id="cam">
        <img class="shot" id="shOver" src="shots/overview.jpg" alt="">
        <img class="shot" id="shNew" src="shots/new_template.jpg" alt="">
        <img class="shot" id="shUns" src="shots/unsaved.jpg" alt="">
        <img class="shot" id="shLib" src="shots/library.jpg" alt="">
        <img class="shot" id="shHtml" src="shots/html.jpg" alt="">
        <img class="shot" id="shFE" src="shots/fields_empty.jpg" alt="">
        <img class="shot" id="shBlock" src="shots/save_blocked.jpg" alt="">
        <img class="shot" id="shFields" src="shots/fields.jpg" alt="">
        <img class="shot" id="shFeesE" src="shots/fees_empty.jpg" alt="">
        <img class="shot" id="shFees" src="shots/fees.jpg" alt="">
        <img class="shot" id="shInsF" src="shots/insert_fields.jpg" alt="">
        <img class="shot" id="shFieldIn" src="shots/field_inserted.jpg" alt="">
        <img class="shot" id="shNewSec" src="shots/new_section.jpg" alt="">
        <img class="shot" id="shInsFee" src="shots/insert_fees.jpg" alt="">
        <img class="shot" id="shFeePrev" src="shots/fee_preview.jpg" alt="">
        <img class="shot" id="shTables" src="shots/insert_tables.jpg" alt="">
        <div class="spot" id="spot"></div>
      </div></div>
    </div>
    <div id="cos"></div>
    <div id="ripple"></div>
    <div id="cursor"><svg viewBox="0 0 24 24"><path d="M4 2.5v17.2l4.7-4.4 3 6.6 3-1.4-3-6.4 6.4-.3z" fill="#fff" stroke="#0F2440" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
    <div id="caps"></div>
  </div>
</div>

<div id="controls">
  <button id="play" aria-label="Play">Play</button>
  <span id="time">0:00 / 2:10</span>
  <div id="track"><div id="marks"></div><input id="scrub" type="range" min="0" max="130" step="0.01" value="0" aria-label="Seek"></div>
  <span id="sceneName">1. Intro</span>
</div>

<script>
const LOGO='../../assets/interlace/logo-crop.png';
const warnIco='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 21h20L12 3z"/><path d="M12 10v5M12 18h.01"/></svg>';

document.getElementById('scenes').innerHTML=`
<section class="scene" id="s1">
  <img id="logo1" src="${LOGO}" alt="Interlace">
  <div class="c">
    <div class="eyebrow" id="e1">Service Agreement System</div>
    <h1 class="h" id="h1">How to use the <em>Template&nbsp;Builder</em></h1>
    <div class="sub" id="sub1">Build a Service Agreement template on <b>one screen</b></div>
  </div>
</section>

<section class="scene" id="s2">
  <div class="t"><div class="eyebrow" id="e2">One screen</div><h2 class="h" id="h2">Four jobs, <em>one place</em></h2></div>
  <div id="jobs">
    <div class="card job"><div class="n">1</div><b>Sections</b><p>Order, show or hide, and edit the blocks of the agreement.</p></div>
    <div class="card job"><div class="n">2</div><b>Custom fields</b><p>Data that differs per case, like Employer ABN.</p></div>
    <div class="card job"><div class="n">3</div><b>Fee schedule</b><p>Default fees, with GST and per-person charges.</p></div>
    <div class="card job"><div class="n">4</div><b>A4 preview</b><p>The document, live, with sample data.</p></div>
  </div>
  <div class="card" id="jobsFoot"><i></i>Once saved, the Create Agreement form shows the template's fields and fees automatically.</div>
</section>

<section class="scene" id="s3">
  <div class="t"><div class="eyebrow" id="e3">Inside the content</div><h2 class="h" id="h3">Three kinds of <em>variables</em></h2></div>
  <div class="card" id="vars">
    <div class="vrow"><div><span class="tok">{{client.name}}</span></div><b>System variable</b><span>Filled from the agreement data</span></div>
    <div class="vrow"><div><span class="tok">{{field.employer_abn}}</span></div><b>Custom field</b><span>Filled in by staff on the form</span></div>
    <div class="vrow"><div><span class="tok">[[FEE_SCHEDULE]]</span></div><b>Calculated table</b><span>Rendered by the engine: fees, totals, signatures</span></div>
  </div>
  <div class="card" id="rule0">${warnIco}Never type fees as text. Fees are data, so the form, the document and the database always match.</div>
</section>

<section class="scene" id="s10">
  <div class="t"><div class="eyebrow" id="e10">How the totals work</div><h2 class="h" id="h10">Client + 1 partner + 1 child, <em>GST 10%</em></h2></div>
  <div class="card" id="calc"><table>
    <tr class="head"><th>Fee</th><th class="r">Amount</th><th class="c">Number</th><th class="r">GST</th><th class="r">Total</th></tr>
    <tr><td>Service Fee <span style="color:var(--mut);font-size:19px">· fixed, +GST</span></td><td class="r">$2,000.00</td><td class="c">1</td><td class="r">$200.00</td><td class="r">$2,200.00</td></tr>
    <tr><td>Visa Application Charge <span style="color:var(--mut);font-size:19px">· per adult</span></td><td class="r">$500.00</td><td class="c">2</td><td class="r">—</td><td class="r">$1,000.00</td></tr>
    <tr><td>Child Charge <span style="color:var(--mut);font-size:19px">· per child</span></td><td class="r">$100.00</td><td class="c">1</td><td class="r">—</td><td class="r">$100.00</td></tr>
    <tr class="tot"><td>Grand Total</td><td></td><td></td><td></td><td class="r">$3,300.00</td></tr>
  </table></div>
  <div class="card" id="units"><div class="k">Number</div>
    <div class="u"><b>Fixed</b><span>1</span></div>
    <div class="u"><b>Per adult</b><span>main client + adult applicants</span></div>
    <div class="u"><b>Per child</b><span>child applicants</span></div>
    <div class="u"><b>Per applicant</b><span>main client + all applicants</span></div>
  </div>
</section>

<section class="scene" id="s12">
  <div class="t"><div class="eyebrow" id="e12">What staff see</div><h2 class="h" id="h12">The <em>Create Agreement</em> form</h2></div>
  <div class="card" id="form"><div class="ttl">Create Agreement · service linked to the template</div>
    <div class="fstep">1–3 · Service, client and applicants</div>
    <div class="fstep new"><b>Employer Sponsored Details</b><div class="row"><span>Employer ABN *</span><span>Nominated Occupation</span><span>Visa Stream</span></div></div>
    <div class="fstep">4 · Responsible Migration Agent</div>
    <div class="fstep new"><b>5 · Fees</b><div class="row"><span>Every fee item</span><span>Number</span><span>GST</span><span>Totals</span></div></div>
  </div>
  <div id="snap">
    <div class="card pt"><b>Checked on submit</b><p>Required fields, types and dropdown options are validated. Only editable fees can be changed.</p></div>
    <div class="card pt"><b>Saved as a snapshot</b><p>Each agreement keeps a copy of the fields and fees. Editing the template later does not change it.</p></div>
    <div class="card pt"><b>Some agreements keep built-in fees</b><p>Skills Assessment, and employer quotes for 482, 186 and 494.</p></div>
  </div>
</section>

<section class="scene" id="s13">
  <div class="c">
    <div class="eyebrow" id="e13">Three things to remember</div>
    <h2 class="h" id="h13">Build templates the <em>right way</em></h2>
    <div id="rules">
      <div class="card rule"><div class="n">1</div><b>Fees are data</b><p>Add them in the Fee schedule and insert a token. Never type amounts in the text.</p></div>
      <div class="card rule"><div class="n">2</div><b>Shared sections</b><p>A section can be used by several templates. Make a copy if your edit should stay here.</p></div>
      <div class="card rule"><div class="n">3</div><b>Nothing is live until Save</b><p>The preview shows unsaved work. Save stores everything at once; Cancel restores the saved version.</p></div>
    </div>
    <img id="logo13" src="${LOGO}" alt="Interlace">
  </div>
</section>`;

function split(el){
  const walk=n=>{[...n.childNodes].forEach(c=>{
    if(c.nodeType===3){const f=document.createDocumentFragment();c.textContent.split(/(\s+)/).forEach(t=>{if(!t)return;if(/^\s+$/.test(t)){f.appendChild(document.createTextNode(t))}else{const s=document.createElement('span');s.className='w';s.textContent=t;f.appendChild(s)}});c.replaceWith(f)}
    else if(c.nodeType===1&&!c.classList.contains('w'))walk(c)})};
  walk(el);return el.querySelectorAll('.w');
}

const stage=document.getElementById('stage'),vp=document.getElementById('viewport');
let SCALE=1;
function fit(){SCALE=vp.clientWidth/1920;stage.style.transform=`scale(${SCALE})`}
window.addEventListener('resize',fit);fit();
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];

const DUR=130;
// on-screen captions [start, end, text]
const CAP=[
  [0.6,5,"A quick guide to the <em>Template Builder</em>."],
  [5.4,9.4,"Build a Service Agreement template on one screen."],
  [9.6,13.6,"Sections, custom fields, a fee schedule and a live A4 preview."],
  [14,17.6,"Content can hold three kinds of variables."],
  [17.8,21.6,"Fees are data, never typed text. The engine calculates the tables."],
  [22,26.6,"Sections on the left, the editor in the middle, the preview on the right."],
  [27,31,"Pick a template here, or start a new one."],
  [31.2,35.4,"A new template starts empty, or as a copy of the sections of another."],
  [35.8,40,"Drag to reorder sections. Untick one to hide it from the agreement."],
  [40.2,43.6,"Any change shows <em>Unsaved changes</em>, with Cancel and Save."],
  [43.8,48,"Add a new section, or reuse one from the library."],
  [48.4,52.4,"Edit the section in the Visual editor, or switch to HTML."],
  [52.6,56,"Page options: start on a new page, or keep the section on one page."],
  [56.4,60.4,"Custom fields hold data that changes per agreement."],
  [60.6,64.6,"Save stays disabled until every field has a valid name and key."],

const OUT=WARP.length?WARP[WARP.length-1][1]:DUR;
function unwarp(t){if(!WARP.length)return t;
  for(let i=0;i<WARP.length-1;i++){const[a,na]=WARP[i],[b,nb]=WARP[i+1];if(t<=nb)return a+(b-a)*Math.max(0,t-na)/(nb-na)}
  return DUR}
function rewarp(t){if(!WARP.length)return t;
  for(let i=0;i<WARP.length-1;i++){const[a,na]=WARP[i],[b,nb]=WARP[i+1];if(t<=b)return na+(nb-na)*Math.max(0,t-a)/(b-a)}
  return OUT}
function retime(inner){if(!WARP.length)return inner;
  // a setter, not an onUpdate callback: seek() suppresses callbacks, and render.py drives the page with seek()
  let now=0;const clock={get t(){return now},set t(v){now=v;inner.seek(unwarp(v))}};
  const m=gsap.timeline({paused:true});
  m.fromTo(clock,{t:0},{t:OUT,duration:OUT,ease:'none',immediateRender:false},0);
  return m}

const setPlayLabel=l=>{playBtn.textContent=l;playBtn.setAttribute('aria-label',l)};
function ui(){const t=TL.time();scrub.value=t;timeEl.textContent=`${fmt(t)} / ${fmt(OUT)}`;
  let n=SCN[0][1];SCN.forEach(s=>{if(t>=rewarp(s[0]))n=s[1]});sn.textContent=n;}
document.getElementById('marks').innerHTML=SCN.slice(1).map(s=>`<i style="left:${rewarp(s[0])/OUT*100}%"></i>`).join('');
const imgs=$$('img').map(i=>i.complete?Promise.resolve():new Promise(r=>{i.onload=i.onerror=r}));
Promise.all([document.fonts.ready,...imgs]).then(()=>{
  fit();TL=retime(build());scrub.max=OUT;TL.eventCallback('onUpdate',ui);
  TL.eventCallback('onComplete',()=>setPlayLabel('Replay'));
  TL.seek(0);ui();
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){TL.play();setPlayLabel('Pause')}
});
playBtn.onclick=()=>{if(!TL)return;
  if(TL.progress()>=1){TL.restart();}
  else if(TL.paused()){TL.play();}
  else{TL.pause();}
  setPlayLabel(!TL.paused()&&TL.progress()<1?'Pause':'Play')};
scrub.oninput=()=>{if(!TL)return;TL.pause();TL.seek(+scrub.value);setPlayLabel('Play');ui()};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();playBtn.click()}});
</script>
</body>
</html>
