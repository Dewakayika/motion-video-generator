<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page Explainer</title>
<!--
  Explainer video template (HTML/CSS + GSAP). Copy this folder to projects/<name>/, then:
    1. capture real screenshots with capture.py into shots/ (2x, 1920x1080 CSS px)
    2. write the storyboard: CAP (captions = voiceover), SCN (scene markers), B (boxes in page px)
    3. build the motion in build(): one commented block per scene with its time range
  Look: data-look="light" or "dark" on #stage. Tools: tools/frames.py (QA), tools/render.py, tools/vo.py.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{
  --chrome-bg:#E9EEF5; --chrome-fg:#0B2A4A; --chrome-muted:#5B6B80; --chrome-panel:#FFFFFF; --chrome-line:#D5DDE8;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --chrome-bg:#06111F; --chrome-fg:#E6F0FA; --chrome-muted:#8EA0BD; --chrome-panel:#0C1A2E; --chrome-line:#1B2C4A; }
}
:root[data-theme="dark"]{ --chrome-bg:#06111F; --chrome-fg:#E6F0FA; --chrome-muted:#8EA0BD; --chrome-panel:#0C1A2E; --chrome-line:#1B2C4A; }

/* video look: light (default) */
#stage{
  --bg:#F3F6FB; --panel:#FFFFFF; --line:#DCE4EF; --fg:#0F2440; --mut:#5B6B80;
  --blue:#3467AD; --sky:#2F6FD6; --tint:#EAF1FB; --orange:#C2620A; --green:#0F8A5F;
  --blob1:rgba(52,103,173,.14); --blob2:rgba(47,111,214,.08);
  --co-bg:#FFFFFF; --co-line:var(--line); --co-text:var(--mut); --cap-bg:rgba(255,255,255,.97); --cap-fg:var(--fg);
  --dim:rgba(15,30,55,.42); --shadow:0 30px 70px rgba(15,36,64,.10); --win-bg:#F5F7FA;
}
/* video look: dark */
#stage[data-look="dark"]{
  --bg:#050A16; --panel:#0E1729; --line:rgba(148,178,230,.16); --fg:#EAF1FB; --mut:#93A4BF;
  --blue:#3B82F6; --sky:#60A5FA; --tint:rgba(59,130,246,.16); --orange:#F59E0B; --green:#34D399;
  --blob1:rgba(59,130,246,.12); --blob2:rgba(59,130,246,0);
  --co-bg:rgba(12,19,34,.96); --co-line:rgba(255,255,255,.1); --co-text:#B7C5DB; --cap-bg:rgba(6,10,20,.86); --cap-fg:#F3F7FD;
  --dim:rgba(3,6,16,.68); --shadow:0 40px 90px rgba(0,0,0,.45); --win-bg:#080C17;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--chrome-bg);color:var(--chrome-fg);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#viewport{position:relative;width:min(calc(100vw - 32px),calc((100vh - 130px) * 16 / 9));aspect-ratio:16/9;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(4,12,28,.18)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--fg);background:var(--bg)}

/* player controls (hidden when rendering) */
#controls{width:min(calc(100vw - 32px),calc((100vh - 130px) * 16 / 9));display:flex;align-items:center;gap:14px;background:var(--chrome-panel);border:1px solid var(--chrome-line);border-radius:12px;padding:10px 14px}
#controls button{font:inherit;font-size:14px;font-weight:600;color:var(--chrome-fg);background:transparent;border:1px solid var(--chrome-line);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
#controls button:focus-visible,#scrub:focus-visible{outline:2px solid #3467AD;outline-offset:2px}
#time{font-variant-numeric:tabular-nums;font-size:14px;color:var(--chrome-muted);min-width:92px}
#track{position:relative;flex:1;display:flex;align-items:center}
#scrub{width:100%;accent-color:#3467AD;margin:0}
#marks{position:absolute;left:0;right:0;top:-9px;height:6px;pointer-events:none}
#marks i{position:absolute;top:0;width:2px;height:6px;background:var(--chrome-muted);opacity:.6;border-radius:1px}
#sceneName{font-size:13px;color:var(--chrome-muted);min-width:190px;text-align:right}
@media (max-width:700px){#sceneName{display:none}}

.bg{position:absolute;inset:0}
.blob{position:absolute;border-radius:50%;filter:blur(120px)}
#blobA{left:-260px;top:-320px;width:1000px;height:1000px;background:var(--blob1)}
#blobB{right:-300px;bottom:-380px;width:900px;height:900px;background:var(--blob2)}

.scene{position:absolute;inset:0;opacity:0;visibility:hidden}
.w{display:inline-block;opacity:0;will-change:transform}
.eyebrow{display:inline-flex;align-items:center;font-size:20px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);opacity:0}
.h{margin:0;font-size:80px;font-weight:600;letter-spacing:-.03em;line-height:1.08;color:var(--fg)}
.h em{font-style:normal;color:var(--blue)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);opacity:0;visibility:hidden}
.t{position:absolute;left:150px;top:140px;display:flex;flex-direction:column;gap:18px}
.t .h{font-size:60px}

/* intro */
#s1 .c{position:absolute;left:0;right:0;top:300px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:30px}
#s1 .sub{font-size:30px;color:var(--mut);opacity:0}
#s1 .sub b{color:var(--fg);font-weight:600}
#logo1{position:absolute;left:50%;top:150px;height:58px;transform:translateX(-50%);opacity:0}

/* concept: numbered cards */
#ideas{position:absolute;left:150px;top:340px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;width:1620px}
.idea{padding:34px 32px 36px}
.idea .n{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:#fff;background:var(--blue)}
.idea b{display:block;margin-top:26px;font-size:32px;font-weight:600;letter-spacing:-.02em}
.idea p{margin:12px 0 0;font-size:21px;line-height:1.45;color:var(--mut)}

/* app window + camera */
#win{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:50% 50%;border-radius:22px;overflow:hidden;background:var(--win-bg);box-shadow:0 50px 120px rgba(15,36,64,.22),0 0 0 1px rgba(15,36,64,.08);opacity:0;visibility:hidden}
#view{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--win-bg)}
#cam{position:absolute;left:0;top:0;width:1920px;transform-origin:0 0}
.shot{position:absolute;left:0;top:0;width:1920px;display:block;opacity:0;visibility:hidden}
.spot{position:absolute;border-radius:12px;border:2px solid var(--sky);box-shadow:0 0 0 6000px var(--dim);opacity:0;visibility:hidden;pointer-events:none}

/* callouts (screen px) */
#cos{position:absolute;inset:0;pointer-events:none}
.co{position:absolute;padding:24px 28px;border-radius:18px;background:var(--co-bg);border:1px solid var(--co-line);box-shadow:0 24px 60px rgba(15,36,64,.22);opacity:0;visibility:hidden}
.co .k{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}
.co .k i{width:8px;height:8px;border-radius:50%;background:var(--sky)}
.co b{display:block;margin-top:10px;font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15;color:var(--fg)}
.co p{margin:10px 0 0;font-size:21px;line-height:1.45;color:var(--co-text)}
.co p em{font-style:normal;color:var(--fg);font-weight:600}
.co.warn .k{color:var(--orange)}
.co.warn .k i{background:var(--orange)}
#cursor{position:absolute;left:0;top:0;width:40px;height:40px;opacity:0;visibility:hidden;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
#cursor svg{width:100%;height:100%;display:block}
#ripple{position:absolute;left:0;top:0;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:3px solid var(--sky);opacity:0;visibility:hidden}

/* summary */
#s9 .c{position:absolute;left:0;right:0;top:140px;display:flex;flex-direction:column;align-items:center;text-align:center}
#s9 .h{font-size:72px}
#rules{display:grid;grid-template-columns:repeat(3,500px);gap:30px;margin-top:64px}
.rule{padding:36px 36px 38px;text-align:left}
.rule .n{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:var(--blue);background:var(--tint)}
.rule b{display:block;margin-top:24px;font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.rule p{margin:12px 0 0;font-size:22px;line-height:1.45;color:var(--mut)}
#logo9{height:52px;margin-top:70px;opacity:0}

/* captions (= voiceover lines), always on */
#caps{position:absolute;left:0;right:0;bottom:44px;height:100px;pointer-events:none}
.cap{position:absolute;left:50%;bottom:0;transform:translateX(-50%);max-width:1560px;width:max-content;padding:18px 36px;border-radius:16px;background:var(--cap-bg);border:1px solid var(--co-line);box-shadow:0 14px 40px rgba(15,36,64,.16);font-size:34px;font-weight:500;line-height:1.3;letter-spacing:-.01em;text-align:center;color:var(--cap-fg);opacity:0;visibility:hidden}
.cap em{font-style:normal;color:var(--sky);font-weight:600}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage" data-look="light">
    <div class="bg"><div class="blob" id="blobA"></div><div class="blob" id="blobB"></div></div>
    <div id="scenes"></div>
    <div id="win">
      <div id="view"><div id="cam">
        <!-- one <img class="shot"> per captured state; swap() cross-fades between them -->
        <img class="shot" id="shOver" src="shots/overview.jpg" alt="">
        <div class="spot" id="spot"></div>
      </div></div>
    </div>
    <div id="cos"></div>
    <div id="ripple"></div>
    <div id="cursor"><svg viewBox="0 0 24 24"><path d="M4 2.5v17.2l4.7-4.4 3 6.6 3-1.4-3-6.4 6.4-.3z" fill="#fff" stroke="#0F2440" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
    <div id="caps"></div>
  </div>
</div>

<div id="controls">
  <button id="play" aria-label="Play">Play</button>
  <span id="time">0:00</span>
  <div id="track"><div id="marks"></div><input id="scrub" type="range" min="0" max="40" step="0.01" value="0" aria-label="Seek"></div>
  <span id="sceneName">1. Intro</span>
</div>

<script>
// logo-crop.png on light looks, logo-white.png on dark looks
const LOGO=document.getElementById('stage').dataset.look==='dark'?'../../assets/interlace/logo-white.png':'../../assets/interlace/logo-crop.png';

document.getElementById('scenes').innerHTML=`
<section class="scene" id="s1">
  <img id="logo1" src="${LOGO}" alt="Interlace">
  <div class="c">
    <div class="eyebrow" id="e1">Product name</div>
    <h1 class="h" id="h1">How to read the <em>Page&nbsp;Name</em></h1>
    <div class="sub" id="sub1">One line of context · <b>data to 08/2026</b></div>
  </div>
</section>

<section class="scene" id="s2">
  <div class="t"><div class="eyebrow" id="e2">What the page answers</div><h2 class="h" id="h2">Three questions, <em>one page</em></h2></div>
  <div id="ideas">
    <div class="card idea"><div class="n">1</div><b>First question</b><p>Short answer in plain language.</p></div>
    <div class="card idea"><div class="n">2</div><b>Second question</b><p>Short answer in plain language.</p></div>
    <div class="card idea"><div class="n">3</div><b>Third question</b><p>Short answer in plain language.</p></div>
  </div>
</section>

<section class="scene" id="s9">
  <div class="c">
    <div class="eyebrow" id="e9">Three things to remember</div>
    <h2 class="h" id="h9">Read the page the <em>right way</em></h2>
    <div id="rules">
      <div class="card rule"><div class="n">1</div><b>First rule</b><p>The one misreading people make most often.</p></div>
      <div class="card rule"><div class="n">2</div><b>Second rule</b><p>A limit of the data, said plainly.</p></div>
      <div class="card rule"><div class="n">3</div><b>Third rule</b><p>What the filters do and do not change.</p></div>
    </div>
    <img id="logo9" src="${LOGO}" alt="Interlace">
  </div>
</section>`;

function split(el){
  const walk=n=>{[...n.childNodes].forEach(c=>{
    if(c.nodeType===3){const f=document.createDocumentFragment();c.textContent.split(/(\s+)/).forEach(t=>{if(!t)return;if(/^\s+$/.test(t)){f.appendChild(document.createTextNode(t))}else{const s=document.createElement('span');s.className='w';s.textContent=t;f.appendChild(s)}});c.replaceWith(f)}
    else if(c.nodeType===1&&!c.classList.contains('w'))walk(c)})};
  walk(el);return el.querySelectorAll('.w');
}

const stage=document.getElementById('stage'),vp=document.getElementById('viewport');
let SCALE=1;
function fit(){SCALE=vp.clientWidth/1920;stage.style.transform=`scale(${SCALE})`}
window.addEventListener('resize',fit);fit();
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];

const DUR=40;
// captions = voiceover script: [start, end, text]. 3.5–5 s each, one idea, ≤ ~80 characters.
const CAP=[
  [0.6,5,"A quick guide to the <em>Page Name</em>."],
  [5.4,9.6,"The page answers three questions for one item."],
  [9.8,13.6,"Here they are, in the order the page shows them."],
  [14.2,18.4,"Three panels: a list on the left, the details in the middle, a preview on the right."],
  [18.6,22.6,"The header holds the filters. They change every number below."],
  [22.8,27,"Each KPI shows one number. The (i) explains how it is calculated."],
  [27.2,31.4,"Click a button and the view updates."],
  [34.6,39.6,"Three rules, and you will read the page the right way."]];
// scene markers for the scrubber: [start, name]
const SCN=[[0,'1. Intro'],[5.2,'2. What it answers'],[14,'3. The page'],[18.4,'4. Filters'],[22.6,'5. KPIs'],[27,'6. Interaction'],[34.4,'7. Summary']];

// boxes in captured page px (from shots/boxes.json): {x, y, w, h}
const B={
  header:{x:310,y:24,w:1580,h:70}, left:{x:310,y:120,w:380,h:930}, main:{x:710,y:120,w:760,h:930}, right:{x:1490,y:120,w:400,h:930},
  chart:{x:740,y:190,w:700,h:300}, kpi:{x:740,y:520,w:330,h:140}, button:{x:1240,y:40,w:220,h:40}};

// camera helpers: camFor(box, screenRect) frames a page box inside a screen rectangle
const R0={x:60,y:50,w:1800,h:860};
function camFor(b,R=R0,max=2.4){const s=Math.min(R.w/b.w,R.h/b.h,max);return{x:R.x+(R.w-b.w*s)/2-b.x*s,y:R.y+(R.h-b.h*s)/2-b.y*s,scale:s}}
const scr=(b,c)=>({x:b.x*c.scale+c.x,y:b.y*c.scale+c.y,w:b.w*c.scale,h:b.h*c.scale});
const pad=(b,p=8)=>({x:b.x-p,y:b.y-p,w:b.w+2*p,h:b.h+2*p});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function co(html,{x,y,w,cls=''}){const d=document.createElement('div');d.className='co '+cls;d.innerHTML=html;
  Object.assign(d.style,{left:x+'px',top:y+'px',width:w+'px'});$('#cos').appendChild(d);return d}
function under(b,c,w,gap=24){const s=scr(b,c);return{x:clamp(s.x+s.w/2-w/2,60,1860-w),y:s.y+s.h+gap,w}}
const K=(k,b,p)=>`<div class="k"><i></i>${k}</div><b>${b}</b>${p?`<p>${p}</p>`:''}`;

CAP.forEach(([a,b,t])=>{const d=document.createElement('div');d.className='cap';d.innerHTML=t;$('#caps').appendChild(d)});

function build(){
  const tl=gsap.timeline({paused:true,defaults:{ease:'power3.out'}});
  const show=(el,t,d=.5,v={})=>tl.to(el,{autoAlpha:1,duration:d,...v},t);
  const hide=(el,t,d=.4,v={})=>tl.to(el,{autoAlpha:0,duration:d,...v},t);
  const words=(el,t,stag=.07)=>{const w=split(el);tl.fromTo(w,{autoAlpha:0,y:28,filter:'blur(10px)'},{autoAlpha:1,y:0,filter:'blur(0px)',duration:.7,stagger:stag},t);return w};
  const pop=(el,t,from={y:24})=>tl.fromTo(el,{autoAlpha:0,...from},{autoAlpha:1,y:0,x:0,scale:1,duration:.55},t);
  const cam=(c,t,d=1.2)=>tl.to('#cam',{x:c.x,y:c.y,scale:c.scale,duration:d,ease:'power2.inOut'},t);
  const spot=(b,t,d=.6)=>{const p=pad(b);tl.to('#spot',{left:p.x,top:p.y,width:p.w,height:p.h,autoAlpha:1,duration:d,ease:'power2.inOut'},t)};
  const swap=(from,to,t,d=.45)=>{tl.to(to,{autoAlpha:1,duration:d},t);tl.to(from,{autoAlpha:0,duration:d},t+d*.6)};
  const click=(sx,sy,t)=>{tl.to('#cursor',{x:sx-6,y:sy-4,duration:.7,ease:'power2.inOut'},t);
    tl.fromTo('#ripple',{x:sx,y:sy,scale:.3,autoAlpha:1},{scale:1.4,autoAlpha:0,duration:.5,ease:'power1.out',immediateRender:false},t+.72);
    tl.to('#cursor',{scale:.85,duration:.1,yoyo:true,repeat:1},t+.7)};
  const clickOn=(b,c,t)=>{const s=scr(b,c);click(s.x+s.w*.5,s.y+s.h*.55,t)};
  const cursorIn=(b,c,t)=>{const s=scr(b,c);tl.fromTo('#cursor',{x:s.x+200,y:s.y+260,autoAlpha:0},{autoAlpha:1,duration:.3},t)};

  gsap.set('#cam',{transformOrigin:'0 0',x:0,y:0,scale:1});
  gsap.set(['#cursor','#ripple'],{transformOrigin:'50% 50%'});
  $$('.cap').forEach((el,i)=>{const[a,b]=CAP[i];
    tl.fromTo(el,{autoAlpha:0,y:14},{autoAlpha:1,y:0,duration:.35},a);tl.to(el,{autoAlpha:0,duration:.25},b-.25)});

  /* 1 Intro 0–5.2 */
  show('#s1',0,.01);
  tl.fromTo('#logo1',{autoAlpha:0,y:-16},{autoAlpha:1,y:0,duration:.7},.2);
  show('#e1',.4,.5);
  words($('#h1'),.6,.08);
  pop('#sub1',1.7);
  hide('#s1',4.8,.4);

  /* 2 What it answers 5.2–14 */
  show('#s2',5.1,.01);
  show('#e2',5.2,.4); tl.fromTo('#h2',{autoAlpha:0,y:20},{autoAlpha:1,y:0,duration:.6},5.3);
  tl.fromTo('#ideas .idea',{autoAlpha:0,y:36},{autoAlpha:1,y:0,duration:.6,stagger:1.2},6.4);
  hide('#s2',13.6,.4);

  /* 3 The page 14–18.4: window flies in, labels per panel */
  gsap.set('#shOver',{autoAlpha:1});
  tl.fromTo('#win',{autoAlpha:0,scale:.72,rotateX:12,y:60,transformPerspective:1600},{autoAlpha:1,scale:.8,rotateX:0,y:-20,duration:1.2},14);
  const lw=380, sx=x=>960+(x-960)*.8-lw/2;   // screen x of a page x while the window is at scale .8
  const coL=co(K('Left','List','The items to choose from.'),{x:sx(500),y:600,w:lw});
  const coM=co(K('Middle','Details','The selected item.'),{x:sx(1090),y:600,w:lw});
  const coR=co(K('Right','Preview','Updates as you work.'),{x:sx(1690),y:600,w:lw});
  pop(coL,15.2); pop(coM,15.7); pop(coR,16.2);
  hide([coL,coM,coR],17.9,.3);
  tl.to('#win',{scale:1,y:0,borderRadius:0,duration:1.1,ease:'power3.inOut'},18);

  /* 4 Filters 18.4–22.6: zoom on the header, spotlight + callout */
  const cH=camFor(B.header,{x:60,y:90,w:1800,h:200});
  cam(cH,18.2,1.2);
  spot(B.header,19);
  const coF=co(K('Filters','Every number follows them','Name each filter and what it changes.'),under(B.header,cH,760,60));
  pop(coF,19.2);
  hide([coF,'#spot'],22.3,.3);

  /* 5 KPIs 22.6–27 */
  const cK=camFor({x:710,y:120,w:760,h:600},{x:60,y:40,w:1100,h:870});
  cam(cK,22.4,1.2);
  spot(B.kpi,23.2);
  const coK=co(K('KPI A','1,234 items','Where the number comes from, in one sentence.'),{x:1200,y:300,w:640});
  pop(coK,23.4);
  hide([coK,'#spot'],26.7,.3);

  /* 6 Interaction 27–34.4: cursor clicks a button (swap to the next captured state here) */
  cam(cH,26.8,1);
  cursorIn(B.button,cH,27.6);
  clickOn(B.button,cH,27.7);
  // swap('#shOver','#shNext',28.5);
  hide('#cursor',28.8,.3);
  spot(B.button,29);
  const coB=co(K('Button','What happens on click','And what does not change.'),under(B.button,cH,640,60));
  pop(coB,29.2);
  hide([coB,'#spot'],31.4,.3);

  /* 7 Summary 34.4–40 */
  tl.to('#win',{autoAlpha:0,scale:.94,duration:.5,ease:'power2.in'},34);
  show('#s9',34.4,.01);
  show('#e9',34.5,.4);
  words($('#h9'),34.6,.07);
  tl.fromTo('.rule',{autoAlpha:0,y:40},{autoAlpha:1,y:0,duration:.6,stagger:.25},35.4);
  pop('#logo9',36.8,{y:12});
  tl.to({},{duration:.01},DUR-.01);
  return tl;
}

// Voiceover retiming, written by tools/vo.py: [[original time, new time], ...]. Empty = original timing.
// Each stretch between two anchors plays the original animation slower, so the scene waits for the voice.
const WARP=[];
const OUT=WARP.length?WARP[WARP.length-1][1]:DUR;
function unwarp(t){if(!WARP.length)return t;
  for(let i=0;i<WARP.length-1;i++){const[a,na]=WARP[i],[b,nb]=WARP[i+1];if(t<=nb)return a+(b-a)*Math.max(0,t-na)/(nb-na)}
  return DUR}
function rewarp(t){if(!WARP.length)return t;
  for(let i=0;i<WARP.length-1;i++){const[a,na]=WARP[i],[b,nb]=WARP[i+1];if(t<=b)return na+(nb-na)*Math.max(0,t-a)/(b-a)}
  return OUT}
function retime(inner){if(!WARP.length)return inner;
  // a setter, not an onUpdate callback: seek() suppresses callbacks, and render.py drives the page with seek()
  let now=0;const clock={get t(){return now},set t(v){now=v;inner.seek(unwarp(v))}};
  const m=gsap.timeline({paused:true});
  m.fromTo(clock,{t:0},{t:OUT,duration:OUT,ease:'none',immediateRender:false},0);
  return m}

let TL;
const playBtn=$('#play'),scrub=$('#scrub'),timeEl=$('#time'),sn=$('#sceneName');
const fmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
const setPlayLabel=l=>{playBtn.textContent=l;playBtn.setAttribute('aria-label',l)};
function ui(){const t=TL.time();scrub.value=t;timeEl.textContent=`${fmt(t)} / ${fmt(OUT)}`;
  let n=SCN[0][1];SCN.forEach(s=>{if(t>=rewarp(s[0]))n=s[1]});sn.textContent=n;}
document.getElementById('marks').innerHTML=SCN.slice(1).map(s=>`<i style="left:${rewarp(s[0])/OUT*100}%"></i>`).join('');
const imgs=$$('img').map(i=>i.complete?Promise.resolve():new Promise(r=>{i.onload=i.onerror=r}));
Promise.all([document.fonts.ready,...imgs]).then(()=>{
  fit();TL=retime(build());scrub.max=OUT;TL.eventCallback('onUpdate',ui);
  TL.eventCallback('onComplete',()=>setPlayLabel('Replay'));
  TL.seek(0);ui();
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){TL.play();setPlayLabel('Pause')}
});
playBtn.onclick=()=>{if(!TL)return;
  if(TL.progress()>=1){TL.restart();}
  else if(TL.paused()){TL.play();}
  else{TL.pause();}
  setPlayLabel(!TL.paused()&&TL.progress()<1?'Pause':'Play')};
scrub.oninput=()=>{if(!TL)return;TL.pause();TL.seek(+scrub.value);setPlayLabel('Play');ui()};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();playBtn.click()}});
</script>
</body>
